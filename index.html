<style>
:root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --line:#38bdf8; --accent:#f59e0b; --bad:#ef4444; --ok:#22c55e; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }

main { padding:10px; display:grid; gap:10px; }
.panel { background:var(--panel); border:1px solid #1f2937; border-radius:14px; padding:10px; }
.info-panel { display:flex; flex-direction:column; gap:10px; }
.info-panel .controls { margin-top:auto; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button, label.file { color:var(--text); border:1px solid #374151; padding:9px 11px; border-radius:10px; font-size:14px; }
button.blue, label.file.blue { background:#2563eb; border-color:#1d4ed8; }

.mode-btn.blocked { background:#dc2626; border-color:#b91c1c; color:#fff; opacity:0.9; }
.mode-btn:disabled { transform:none; }
button:active, label.file:active { transform:translateY(1px); }
input[type=file] { display:none; }
input.speed-input { width:100%; margin-top:6px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:8px; font-size:18px; font-weight:700; }
input.point-input { min-width:160px; flex:1 1 180px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:9px 11px; font-size:14px; }
canvas { width:100%; height:46vh; min-height:280px; display:block; background:#020617; border-radius:12px; touch-action:pan-y; }
.grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
.tile { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:9px; }
.tile b { display:block; font-size:18px; margin-top:3px; }

function formatCoordValue(value, digitsBefore){
  if(!Number.isFinite(value)) return '-';
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value);
  let s = abs.toFixed(6);
  const parts = s.split('.');
  parts[0] = parts[0].padStart(digitsBefore, '0');
  return sign + parts[0] + '.' + parts[1];
}
function formatGpxCoord(p){
  if(!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lon)) return '-';
  return formatCoordValue(p.lat, 2) + ' ' + formatCoordValue(p.lon, 3);
}

function rad(x){ return x*Math.PI/180; }
function hav(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const lat1=rad(a.lat), lat2=rad(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function currentRouteSignature(){
  if(!route.length) return null;
  const first = route[0], last = route[route.length-1];
  return [
    route.length,
    Math.round(totalDist),
    first.lat.toFixed(5), first.lon.toFixed(5),
    last.lat.toFixed(5), last.lon.toFixed(5)
  ].join('|');
}
function loadRoughTrack(){
  const sig = currentRouteSignature();
  try{
    const raw = localStorage.getItem(ROUGH_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if(obj && obj.signature === sig && Number.isFinite(obj.dist)){
      roughTrack = {
        signature:sig,
        dist:Math.max(0, obj.dist || 0),
        points:Array.isArray(obj.points)?obj.points:[]
      };
    } else {
      roughTrack = {signature:sig, dist:0, points:[]};
    }
  }catch(e){
    roughTrack = {signature:sig, dist:0, points:[]};
  }
}
function saveRoughTrack(){
  try{ localStorage.setItem(ROUGH_KEY, JSON.stringify(roughTrack)); }catch(e){}
}
function loadSpeedHistory(){
  const sig = currentRouteSignature();
  try{
    const raw = localStorage.getItem(SPEED_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if(obj && obj.signature === sig && Array.isArray(obj.points)){
      speedHistory = {signature:sig, points:obj.points.filter(p => Number.isFinite(p.t) && Number.isFinite(p.dist))};
    } else {
      speedHistory = {signature:sig, points:[]};
    }
  }catch(e){
    speedHistory = {signature:sig, points:[]};
  }
}
function saveSpeedHistory(){
  try{ localStorage.setItem(SPEED_KEY, JSON.stringify(speedHistory)); }catch(e){}
}
function loadHistoricalKalModel(){
  try{
    const raw = localStorage.getItem(HIST_KAL_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.groupStats || !parsed.fineStats) return null;
    return parsed;
  }catch(e){
    return null;

function recordSpeedPosition(dist, source='gps', timeOverride=null){

  if(speedHistory.signature !== currentRouteSignature()) loadSpeedHistory();
  const now = Number.isFinite(timeOverride) ? timeOverride : Date.now();
  dist = clamp(dist, 0, totalDist);
  const last = speedHistory.points.length ? speedHistory.points[speedHistory.points.length-1] : null;

  // Ręczne ustawienie pozycji synchronizuje obliczenia.
  // Jeżeli korekta cofa kilometraż, zaczynamy nową serię, aby nie zaniżać/zawyżać średniej.
  if(source === 'manual'){
    if(last && dist < last.dist - 500){
      speedHistory.points = [];
    }
    speedHistory.points.push({t:now, dist, source});
  } else if(source === 'reset'){
    speedHistory.points = [{t:now, dist, source}];
  } else {
    if(last){
      const dt = (now - last.t) / 1000;
      const dd = dist - last.dist;
      if(dt < 30) return;
      if(Math.abs(dd) < 20 && dt < 180) return;
      if(dd < -300) return;
      if(dd > 8000) return;

    speedHistory.points.push({t:now, dist, source});
  }

function buildSurfaceIntervals(surface){
  const intervals = [];
  if(!route.length) return intervals;
  let start = null;
  let prev = null;
  for(const p of route){
    if(p.surface === surface){
      if(start === null) start = p.dist;
      prev = p.dist;
    } else if(start !== null){
      if(prev > start) intervals.push({start, end:prev});
      start = null;
      prev = null;
    }
  }
  if(start !== null && prev > start) intervals.push({start, end:prev});
  return intervals;
}

function buildAsphaltIntervals(points){
  if(!route.length || !Array.isArray(points) || points.length < 2) return [];
  const raw = [];
  let currentStart = null;
  let prevDist = null;

  for(const p of points){
    if(!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
    const n = nearestGlobal(p.lat, p.lon);
    if(!n || !Number.isFinite(n.d) || n.d > 80) {
      if(currentStart !== null && prevDist !== null && prevDist > currentStart) raw.push({start:currentStart, end:prevDist});
      currentStart = null;
      prevDist = null;
      continue;
    }
    const d = route[n.idx].dist;
    if(currentStart === null){
      currentStart = d;
      prevDist = d;
      continue;
    }
    if(d < prevDist - 200 || d - prevDist > 1200){
      if(prevDist > currentStart) raw.push({start:currentStart, end:prevDist});
      currentStart = d;
    }
    prevDist = d;
  }
  if(currentStart !== null && prevDist !== null && prevDist > currentStart) raw.push({start:currentStart, end:prevDist});

  raw.sort((a,b)=>a.start-b.start);
  const merged = [];
  for(const seg of raw){
    const start = clamp(Math.min(seg.start, seg.end), 0, totalDist);
    const end = clamp(Math.max(seg.start, seg.end), 0, totalDist);
    if(end <= start + 5) continue;
    const last = merged[merged.length-1];
    if(last && start <= last.end + 50) last.end = Math.max(last.end, end);
    else merged.push({start, end});
  }
  return merged;
}

  const now = Date.now();

  if(!last){
    roughTrack.points.push(pt);
    saveRoughTrack();
    return;
  }

  const dd = hav({lat:last.lat, lon:last.lon}, {lat, lon});

function surfaceSegmentsFromData(data, surface){

function orderedSurfaceRoute(segments){
  const usable = segments.filter(seg => Array.isArray(seg) && seg.length >= 2);
  if(!usable.length) return [];
  if(usable.length === 1) return usable[0].map(p => Object.assign({}, p));
  let best = null;
  let bestCost = Infinity;
  for(let startIdx=0; startIdx<usable.length; startIdx++){
    const used = new Set([startIdx]);
    const order = [usable[startIdx]];
    let last = usable[startIdx][usable[startIdx].length - 1];
    let cost = 0;
    while(used.size < usable.length){
      let bestIdx = -1;
      let bestD = Infinity;
      for(let i=0; i<usable.length; i++){
        if(used.has(i)) continue;
        const d = hav(last, usable[i][0]);
        if(d < bestD){
          bestD = d;
          bestIdx = i;
        }
      }
      if(bestIdx < 0) break;
      used.add(bestIdx);
      order.push(usable[bestIdx]);
      last = usable[bestIdx][usable[bestIdx].length - 1];
      cost += bestD;
    }
    if(order.length === usable.length && cost < bestCost){
      best = order;
      bestCost = cost;
    }
  }
  const points = [];
  for(const seg of (best || usable)){
    for(const p of seg){
      const last = points[points.length - 1];
      if(last && hav(last, p) < 1) continue;
      points.push(Object.assign({}, p));
    }
  }
  return points;
}

function nearestGlobal(lat, lon){
  const p={lat, lon};
  let best=0, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};

function nearestGlobalWithRoughMileage(lat, lon){
  const p={lat, lon};
  let distances=[];
  let bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    distances.push(d);
    if(d<bestD) bestD=d;
  }

  const rough = roughRouteProgressDist();
  let best=0, bestScore=Infinity;
  for(let i=0;i<route.length;i++){
    const d = distances[i];
    // Kandydaci bliscy geograficznie. Przy odcinkach tam–powrót będzie ich więcej.
    if(d > bestD + 80 && d > 160) continue;
    const roughPenalty = rough > 0 ? Math.abs(route[i].dist - rough) / 8 : 0;
    const score = d + roughPenalty;
    if(score < bestScore){ bestScore=score; best=i; }
  }
  return {idx:best, d:distances[best]};
}


function nearestInDistWindow(lat, lon, centerDist, halfWindow){

  const endDist = Math.min(totalDist, centerDist + halfWindow);
  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};

function nearestTracked(lat, lon){
  const p={lat, lon};

  // Po ustawieniu pozycji ręcznie przez pewien czas nie pozwalamy
  // algorytmowi przeskoczyć na inny, podobny geograficznie fragment GPX.
  if(route.length && Date.now() < manualLockUntil && Number.isFinite(manualLockCenterDist)){
    const locked = nearestInDistWindow(lat, lon, manualLockCenterDist, MANUAL_LOCK_WINDOW_M);
    if(Number.isFinite(locked.d)){
      manualLockCenterDist = route[locked.idx].dist;
      return locked;
    }
  }

  if(!trackingInitialized || !route.length){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    trackingInitialized = true;
    return g;
  }

  const currentDist = route[markerIdx].dist;
  const backWindow = 700;     // pozwala na wolne cofanie i korekty GPS
  const forwardWindow = 2500; // pozwala na normalny postęp między kolejnymi odczytami
  const startDist = Math.max(0, currentDist - backWindow);
  const endDist = Math.min(totalDist, currentDist + forwardWindow);

  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }

  // Reaktywacja po dużym zejściu ze śladu lub po przerwie.
  // Próg jest wysoki, żeby nie przeskakiwać między odcinkami tam/powrót
  // biegnącymi tą samą drogą.
  if(bestD > 1000){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    if(g.d < bestD){ return g; }
  }

  return {idx:best, d:bestD};
}

  for(let i=1; i<points.length; i++){
    const a = points[i-1], b = points[i];

    const span = b.dist - a.dist;
    const r = span > 0 ? (dist - a.dist) / span : 0;
    return {

      lon:a.lon + (b.lon - a.lon) * r,
      ele:Number.isFinite(a.ele) && Number.isFinite(b.ele) ? a.ele + (b.ele - a.ele) * r : null,

function speedModelRowFor(surface, slope){

  const rows = model.rows.filter(row => row.surface === s);
  if(!rows.length) return null;
  if(!Number.isFinite(slope)){
    return rows.reduce((best, row) => {
      if(!best || (row.n || 0) > (best.n || 0)) return row;
      return best;
    }, null);
  }
  const direct = rows.find(row =>
    (row.slopeMin === null || slope >= row.slopeMin)
    && (row.slopeMax === null || slope < row.slopeMax)

  if(direct) return direct;
  return rows.reduce((best, row) => {
    const min = row.slopeMin === null ? slope : row.slopeMin;
    const max = row.slopeMax === null ? slope : row.slopeMax;
    const mid = (min + max) / 2;
    const gap = Math.abs(slope - mid);

function csvModelBreakdownBetweenDist(startDist, endDist){

    teren:{distKm:0, hours:0},
    asfalt:{distKm:0, hours:0}
  };
  for(const bucket of Object.values(buckets)){
    const row = bucket.row;
    if(!row || !Number.isFinite(row.modelKmh) || row.modelKmh <= 0) return null;
    const surface = row.surface === 'asfalt' ? 'asfalt' : 'teren';
    const hours = bucket.distKm / row.modelKmh;
    out.total.distKm += bucket.distKm;
    out.total.hours += hours;
    out[surface].distKm += bucket.distKm;
    out[surface].hours += hours;
  }

}
function csvModelSecondsBetweenDist(startDist, endDist){

function correctionSegmentsFromSpeedHistory(){
  if(!route.length || !speedHistory || !Array.isArray(speedHistory.points) || speedHistory.points.length < 2) return [];
  const segments = [];
  let anchor = speedHistory.points[0];
  for(let i=1; i<speedHistory.points.length; i++){
    const b = speedHistory.points[i];
    if(!kalSegmentAllowed(anchor, b)){
      anchor = b;
      continue;
    }
    const dtH = (b.t - anchor.t) / 3600000;
    const ddKm = (b.dist - anchor.dist) / 1000;
    if(!Number.isFinite(dtH) || !Number.isFinite(ddKm) || ddKm < 0){
      anchor = b;
      continue;
    }
    if(dtH >= REAL_MODEL_MIN_TIME_H && ddKm >= REAL_MODEL_MIN_DIST_KM){
      const breakdown = csvModelBreakdownBetweenDist(anchor.dist, b.dist);
      if(breakdown && breakdown.total.hours > 0){
        segments.push({a:anchor, b, dtH, ddKm, breakdown});
      }
      anchor = b;
    }

}
function realModelCorrectionStats(){
  let realHours = 0;
  let modelHours = 0;
  let distKm = 0;
  for(const segment of correctionSegmentsFromSpeedHistory()){
    realHours += segment.dtH;
    modelHours += segment.breakdown.total.hours;
    distKm += segment.ddKm;
  }
  if(realHours <= 0 || modelHours <= 0 || distKm <= 0) return null;
  const rawFactor = clamp(realHours / modelHours, 0.4, 2.5);
  const weight = clamp(distKm / REAL_MODEL_FULL_WEIGHT_KM, 0, 1);
  return {
    distKm,
    realHours,
    modelHours,
    rawFactor,
    weight,

function realModelWeightedFactor(){

function realModelSurfaceComparison(){

    teren:{distKm:0, realHours:0, modelHours:0},
    asfalt:{distKm:0, realHours:0, modelHours:0}
  };
  let hasData = false;
  for(const segment of correctionSegmentsFromSpeedHistory()){
    const breakdown = segment.breakdown;
    for(const surface of ['teren','asfalt']){
      const part = breakdown[surface];
      if(!part || part.distKm <= 0 || part.hours <= 0) continue;
      const share = part.hours / breakdown.total.hours;
      result[surface].distKm += part.distKm;
      result[surface].modelHours += part.hours;
      result[surface].realHours += segment.dtH * share;
      hasData = true;
    }
  }
  return hasData ? result : null;
}

function routeKalBucketsBetweenDist(startDist, endDist){
  if(!route.length) return null;
  startDist = clamp(startDist, 0, totalDist);
  endDist = clamp(endDist, 0, totalDist);
  if(endDist <= startDist + 1) return emptyKalBuckets(KAL_FINE_KEYS);
  const model = activeKalModel();
  if(model && model.type === 'csv'){
    const buckets = {};
    let d = startDist;
    let missing = false;
    while(d < endDist - 0.5){
      const next = Math.min(endDist, d + KAL_CHUNK_M);
      const mid = (d + next) / 2;
      const spanKm = (next - d) / 1000;
      const row = speedModelRowFor(surfaceAtDist(mid), slopePercentBetweenDist(d, next));
      if(row && spanKm > 0){
        const key = row.surface + '|' + row.slopeClass;
        if(!buckets[key]) buckets[key] = {distKm:0, count:0, row};
        buckets[key].distKm += spanKm;
        buckets[key].count += 1;
      } else if(spanKm > 0){
        missing = true;
      }
      d = next;
    }
    if(missing) return null;
    return buckets;
  }

  const buckets = emptyKalBuckets(KAL_FINE_KEYS);
  let d = startDist;
  while(d < endDist - 0.5){
    const next = Math.min(endDist, d + KAL_CHUNK_M);
    const spanKm = (next - d) / 1000;
    const fineKey = kalFineBucketForSlope(slopePercentBetweenDist(d, next));
    if(fineKey && spanKm > 0){

}
function kalEtaSecondsBetweenDist(startDist, endDist){
  if(!Number.isFinite(startDist) || !Number.isFinite(endDist)) return null;
  if(endDist <= startDist + 1) return 0;
  const speeds = activeKalModel();
  const routeBuckets = routeKalBucketsBetweenDist(startDist, endDist);
  if(!speeds || !routeBuckets) return null;
  if(speeds.type === 'csv'){
    let hours = 0;
    for(const bucket of Object.values(routeBuckets)){
      const kmh = bucket.row && bucket.row.modelKmh;
      if(!Number.isFinite(kmh) || kmh <= 0) return null;
      hours += bucket.distKm / kmh;
    }
    return hours * 3600 * realModelWeightedFactor();
  }

  let hours = 0;
  for(const key of KAL_FINE_KEYS){
    const distKm = routeBuckets[key].distKm;
    if(distKm <= 0) continue;
    const resolved = kalResolvedSpeedForFineBucket(speeds, key);
    const kmh = resolved ? resolved.kmh : null;
    if(kmh === null || !Number.isFinite(kmh) || kmh <= 0) return null;

  }

}
function kalTimeSpreadSecondsBetweenDist(startDist, endDist){

  const values = [];
  if(parts.route !== null) values.push(parts.route);
  if(parts.model !== null) values.push(parts.model);
  if(!values.length) return null;
  const total = Math.sqrt(values.reduce((sum, seconds) => sum + seconds * seconds, 0));

}
function kalTimeSpreadPartsSecondsBetweenDist(startDist, endDist){
  if(etaMode !== 'KAL') return null;
  if(!Number.isFinite(startDist) || !Number.isFinite(endDist)) return null;
  if(endDist <= startDist + 1) return {route:0, model:0};
  const stats = kalBucketSpeedStats();
  const model = activeKalModel();
  const routeBuckets = routeKalBucketsBetweenDist(startDist, endDist);
  if(!stats || !routeBuckets) return null;
  if(model && model.type === 'csv'){
    let varianceHours = 0;
    let used = false;
    for(const bucket of Object.values(routeBuckets)){
      const row = bucket.row;
      if(!row || !Number.isFinite(row.modelKmh) || row.modelKmh <= 0 || !Number.isFinite(row.uncertaintyKmh)) continue;
      const dtdv = bucket.distKm / (row.modelKmh * row.modelKmh);
      varianceHours += Math.pow(dtdv * row.uncertaintyKmh, 2);
      used = true;
    }
    if(!used) return null;
    const factor = realModelWeightedFactor();
    varianceHours *= factor * factor;
    const modelSeconds = Math.sqrt(varianceHours) * 3600;
    let routeSeconds = null;
    const correction = realModelCorrectionStats();
    if(correction && correction.weight > 0 && Number.isFinite(correction.rawFactor)){
      const correctionUncertainty = Math.abs(correction.rawFactor - 1) * (1 - correction.weight);

      if(Number.isFinite(modelHours) && modelHours > 0){
        routeSeconds = modelHours * correctionUncertainty * 3600;
      }
    }
    return {
      route:Number.isFinite(routeSeconds) ? routeSeconds : null,
      model:Number.isFinite(modelSeconds) ? modelSeconds : null

  }

  let varianceHours = 0;
  let used = false;
  for(const key of KAL_FINE_KEYS){
    const distKm = routeBuckets[key].distKm;
    const s = kalResolvedStatsForFineBucket(stats, key);
    if(!s || distKm <= 0 || s.mean === null || s.sd === null) continue;

function formatTimeSpread(seconds){

function calibrationModelReady(){

function etaSpeedKmhForSlope(slope=null){

function etaSpeedKmhForInterval(startDist, endDist){

function etaToEndSeconds(){

  const left = Math.max(0, totalDist - p.dist);
  if(etaMode === 'KAL'){

function setManualPositionFromSlider(){
  if(!route.length) return;

  // Suwak oznacza przybliżony już przejechany kilometr GPX.
  // Po kliknięciu program nie przyjmuje suwaka jako finalnej pozycji,
  // tylko szuka najbliższego punktu GPX względem aktualnego GPS
  // w oknie wokół wskazanego kilometra. Dzięki temu odcinki tam–powrót
  // są rozróżniane przez postęp po śladzie, a nie przez samą lokalizację.
  const approxValue = sim ? Number(sim.value) || 0 : Math.round(1000*markerIdx/Math.max(1, route.length-1));

  const approxDist = route[approxIdx].dist;

  let n = null;
  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){

  manualLockCenterDist = route[markerIdx].dist;

  } else {
    statusEl.innerHTML='<span class="accent">Ustaw km: pozycja ustawiona z suwaka: km '+km+'. Brak aktualnego odczytu GPS do dopasowania punktu.</span>';

function resizeCanvasToDisplaySize(c){

}

function draw(){
  if(!route.length) return;
  if(viewEnd<=viewStart){ viewStart=0; viewEnd=totalDist; }
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const padL=76*devicePixelRatio, padR=18*devicePixelRatio, padT=22*devicePixelRatio, padB=72*devicePixelRatio;
  const vis=visibleRoute();

  // Zakres Y ma stałą wysokość, ale środek osi jest ustawiany na wysokości
  // aktualnego punktu GPX. Dzięki temu znacznik pozostaje pionowo w połowie
  // wykresu podczas przewijania profilu.
  const allEles=route.map(p=>p.ele).filter(Number.isFinite);
  let minRaw=Math.min(...allEles), maxRaw=Math.max(...allEles);
  if(!Number.isFinite(minRaw) || !Number.isFinite(maxRaw) || maxRaw<=minRaw){ minRaw=0; maxRaw=1; }
  const rawRange=Math.max(20, maxRaw-minRaw+20);
  const shownRange=rawRange / yStretch;
  const markerEle = route[markerIdx] && Number.isFinite(route[markerIdx].ele) ? route[markerIdx].ele : (minRaw+maxRaw)/2;
  const minE=markerEle-shownRange/2, maxE=markerEle+shownRange/2;
  function x(p){return padL + ((p.dist-viewStart)/(viewEnd-viewStart))*(w-padL-padR);}
  function y(p){return padT + (1-(p.ele-minE)/(maxE-minE))*(h-padT-padB);}
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.4*devicePixelRatio; ctx.font=(22*devicePixelRatio)+'px system-ui'; ctx.fillStyle='#94a3b8';
  for(let k=0;k<=4;k++){
    const yy=padT+k*(h-padT-padB)/4; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke();
    const val=Math.round(maxE-k*(maxE-minE)/4); ctx.fillText(val+' m', 6*devicePixelRatio, yy+7*devicePixelRatio);
  }
  drawProfileSurfaceLine(x, y);
  drawUserPoints(x, y, padT, padB, w, h);
  const m=route[markerIdx];
  slopeLabelHit = null;
  if(m.dist>=viewStart && m.dist<=viewEnd){
    const mx=x(m), my=y(m);
    const mc = markerColor();
    ctx.strokeStyle=mc; ctx.lineWidth=2.2*devicePixelRatio; ctx.beginPath(); ctx.moveTo(mx,padT); ctx.lineTo(mx,h-padB); ctx.stroke();
  }
  drawForecast(x, padL, padT, padB, w, h);
  if(m.dist>=viewStart && m.dist<=viewEnd){
    const mx=x(m), my=y(m);
    drawSlopeLabelAtMarker(mx, my, padT, h-padB);
  }
  drawDistanceScale(padL, padR, padT, padB, w, h);

  // // drawSlopeLabelOverlay();

  // drawForwardSlopeFieldInDraw
  updateForwardSlope50Field();

  updateSliderFromMarkerV54();

  updatePositionSliderV54();

  drawRouteMap();
}

function drawProfileSurfaceLine(x, y){
  const samples = visibleRoute();
  if(samples.length < 2) return;
  ctx.lineWidth = 2.2 * devicePixelRatio;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  function strokeSamples(points, color, widthFactor=1){
    if(points.length < 2) return;
    ctx.lineWidth = 2.2 * devicePixelRatio * widthFactor;
    ctx.beginPath();
    for(let i=0;i<points.length;i++){
      const xx = x(points[i]), yy = y(points[i]);
      if(i === 0) ctx.moveTo(xx, yy);
      else ctx.lineTo(xx, yy);
    }
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  strokeSamples(samples, '#22c55e');
  for(const seg of asphaltIntervals){
    const s = Math.max(viewStart, seg.start);
    const e = Math.min(viewEnd, seg.end);
    if(e <= s + 1) continue;
    const segSamples = [routeSampleAtDist(s)]
      .concat(route.filter(p => p.dist > s && p.dist < e))
      .concat([routeSampleAtDist(e)]);
    strokeSamples(segSamples, '#94a3b8');
  }

  let steepRun = [];
  let steepRunDist = 0;
  function flushSteepRun(){
    if(steepRun.length >= 2 && steepRunDist >= 20) strokeSamples(steepRun, '#ef4444', 1.25);
    steepRun = [];
    steepRunDist = 0;
  }
  for(let i=1;i<samples.length;i++){
    const a = samples[i-1], b = samples[i];
    const dd = b.dist - a.dist;
    const slope = dd > 0 ? 100 * (b.ele - a.ele) / dd : null;
    const steep = dd > 0 && Math.abs(slope) >= 15 && !intervalTouchesAsphalt(a.dist, b.dist);
    if(steep){
      if(!steepRun.length) steepRun.push(a);
      steepRun.push(b);
      steepRunDist += dd;
    } else {
      flushSteepRun();
    }
  }
  flushSteepRun();

  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.4 * devicePixelRatio;
  for(const seg of asphaltIntervals){
    for(const d of [seg.start, seg.end]){
      if(d < viewStart || d > viewEnd) continue;
      const p = routeSampleAtDist(d);
      if(!p) continue;
      const xx = x(p), yy = y(p);
      const len = 16 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(xx, yy - len);
      ctx.lineTo(xx, yy + len);
      ctx.stroke();
    }
  }
  ctx.restore();
}


function routeSampleAtDist(targetDist){
  if(!route.length) return null;
  targetDist = clamp(targetDist, 0, totalDist);
  if(targetDist <= 0) return {...route[0]};
  if(targetDist >= totalDist) return {...route[route.length-1]};
  for(let i=1;i<route.length;i++){
    const a=route[i-1], b=route[i];
    if(b.dist >= targetDist){
      const span = Math.max(1e-9, b.dist-a.dist);
      const f = (targetDist-a.dist)/span;
      return {
        lat:a.lat+(b.lat-a.lat)*f,
        lon:a.lon+(b.lon-a.lon)*f,
        ele:a.ele+(b.ele-a.ele)*f,
        dist:targetDist,
        t:a._timeSeg && a._timeSeg === b._timeSeg && Number.isFinite(a.t) && Number.isFinite(b.t) ? a.t + (b.t - a.t) * f : NaN,
        _timeSeg:a._timeSeg && a._timeSeg === b._timeSeg ? a._timeSeg : null,
        surface:f < 0.5 ? a.surface : b.surface
      };
    }
  }
  return {...route[route.length-1]};
}

function forecastStats(){
  if(!route.length) return null;
  const startDist = route[markerIdx] ? route[markerIdx].dist : 0;
  const width = Math.max(1, viewEnd-viewStart);
  if(!Number.isFinite(forecastTargetDist)){
    forecastTargetDist = clamp(startDist + width * forecastOffsetRatio, 0, totalDist);
    localStorage.setItem('profilGpsForecastTargetDist', String(forecastTargetDist));
  }
  if(forecastTargetDist <= startDist + 1){
    const pushDist = Math.max(100, width * forecastOffsetRatio);
    forecastTargetDist = clamp(startDist + pushDist, startDist, totalDist);
    localStorage.setItem('profilGpsForecastTargetDist', String(forecastTargetDist));
    forecastOffsetRatio = clampForecastRatio((forecastTargetDist - startDist) / width);
    localStorage.setItem('profilGpsForecastOffsetRatio', String(forecastOffsetRatio));
  }
  const endDist = clamp(forecastTargetDist, startDist, totalDist);
  return elevationStatsBetweenDist(startDist, endDist);
}
function preserveForecastTargetForManualPosition(newMarkerDist){
  if(!route.length) return;
  const current = forecastStats();
  if(!current || !Number.isFinite(current.endDist)) return;
  const startDist = clamp(newMarkerDist, 0, totalDist);
  forecastTargetDist = clamp(current.endDist, startDist, totalDist);
  const width = Math.max(1, viewEnd - viewStart);
  forecastOffsetRatio = clampForecastRatio((forecastTargetDist - startDist) / width);
  localStorage.setItem('profilGpsForecastTargetDist', String(forecastTargetDist));
  localStorage.setItem('profilGpsForecastOffsetRatio', String(forecastOffsetRatio));
}

function elevationStatsBetweenDist(startDist, endDist){
  if(!route.length) return null;
  startDist = clamp(startDist, 0, totalDist);
  endDist = clamp(endDist, 0, totalDist);
  if(endDist <= startDist + 1) return {startDist, endDist, up:0, down:0};

  const samples = [routeSampleAtDist(startDist)];
  for(const p of route){
    if(p.dist > startDist && p.dist < endDist) samples.push(p);
  }
  samples.push(routeSampleAtDist(endDist));

  let up=0, down=0;
  for(let i=1;i<samples.length;i++){
    const d = samples[i].ele - samples[i-1].ele;
    if(d>0) up += d;
    else down += -d;
  }
  return {startDist, endDist, up, down};
}


function clampForecastRatio(v){
  if(!Number.isFinite(v)) return 0.25;
  return clamp(v, 0, 1.00);
}
function setForecastFromClientX(clientX){
  if(!route.length || viewEnd<=viewStart) return;
  mapFitAll = false;
  const rect=canvas.getBoundingClientRect();
  const xCss=clientX-rect.left;
  const wCss=rect.width;
  const padL=76, padR=18;
  const frac=clamp((xCss-padL)/(wCss-padL-padR),0,1);
  const startDist=route[markerIdx] ? route[markerIdx].dist : 0;
  const targetDist=clamp(viewStart+frac*(viewEnd-viewStart), startDist, totalDist);
  forecastTargetDist=targetDist;
  forecastOffsetRatio=clampForecastRatio((targetDist-startDist)/(viewEnd-viewStart));
  resetEtaDisplaySmoothing();
  localStorage.setItem('profilGpsForecastTargetDist', String(forecastTargetDist));

}
function isForecastHandle(clientX, clientY){
  if(!forecastLabelHit) return false;
  const rect=canvas.getBoundingClientRect();
  const x=(clientX-rect.left)*devicePixelRatio;
  const y=(clientY-rect.top)*devicePixelRatio;
  const h=forecastLabelHit;
  const labelHit=x>=h.lx && x<=h.lx+h.labelW && y>=h.ly && y<=h.ly+h.labelH;
  const lineHit=Math.abs(x-h.fx)<=34*devicePixelRatio && y>=h.padT && y<=h.bottom;
  // v54 bottom forecast handle zone
  const bottomZone = Math.abs(x-h.fx) <= 46*devicePixelRatio && y >= (h.bottom - 90*devicePixelRatio) && y <= h.bottom;
  return labelHit || lineHit || bottomZone;
}


function drawSlopeLabelAtMarker(x, y, padT, bottom){
  const slope = slopePercentAtIndex(markerIdx);

  ctx.font = `bold ${18*dpr}px system-ui, -apple-system, Segoe UI, sans-serif`;

  ctx.lineTo(bx+boxW, by+boxH-r);
  ctx.quadraticCurveTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH);
  ctx.lineTo(bx+r, by+boxH);
  ctx.quadraticCurveTo(bx, by+boxH, bx, by+boxH-r);
  ctx.lineTo(bx, by+r);
  ctx.quadraticCurveTo(bx, by, bx+r, by);
  ctx.closePath();

  ctx.fillStyle = "rgba(3, 7, 18, 0.90)";

function routeIndexNearDistance(dist){
  if(!route || !route.length) return null;
  let best = 0;
  let bestD = Math.abs(route[0].dist - dist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - dist);
    if(d < bestD){ bestD = d; best = i; }
  }
  return best;
}

function computeSlopeAtMarkerPercent(){
  if(!route || !route.length || markerIdx == null || !route[markerIdx]) return null;
  const d0 = route[markerIdx].dist;
  const i1 = routeIndexNearDistance(Math.max(0, d0 - 20));
  const i2 = routeIndexNearDistance(Math.min(totalDist, d0 + 20));
  if(i1 == null || i2 == null || i1 === i2) return null;
  const dd = route[i2].dist - route[i1].dist;
  if(!Number.isFinite(dd) || Math.abs(dd) < 1) return null;
  const dh = route[i2].ele - route[i1].ele;
  if(!Number.isFinite(dh)) return null;
  return 100 * dh / dd;
}

function drawUserPoints(x, y, padT, padB, w, h){
  const points = allVisiblePoints();
  if(!points.length) return;
  const visiblePoints = points.filter(pt => pt.dist >= viewStart && pt.dist <= viewEnd);
  if(!visiblePoints.length) return;

  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold '+(18*devicePixelRatio)+'px system-ui';
  const placedLabels = [];
  const labelTop = padT + 8*devicePixelRatio;
  const labelGap = 6*devicePixelRatio;
  const labelRows = 3;
  for(const pt of visiblePoints){
    const ele = elevationAtDist(pt.dist);
    const xx = x({dist:pt.dist, ele:ele});
    const yy = y({dist:pt.dist, ele:ele});
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1.5*devicePixelRatio;
    ctx.beginPath();
    ctx.moveTo(xx, padT);
    ctx.lineTo(xx, h-padB);
    ctx.stroke();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.arc(xx, yy, 5*devicePixelRatio, 0, Math.PI*2);
    ctx.fill();
    const text = String(pt.label || 'punkt');
    const labelW = Math.min(ctx.measureText(text).width + 24*devicePixelRatio, 260*devicePixelRatio);
    const labelH = 32*devicePixelRatio;
    let lx = clamp(xx - labelW/2, padLForFloatingLabels(), w - 18*devicePixelRatio - labelW);
    let row = 0;
    while(row < labelRows && placedLabels.some(r => r.row === row && lx < r.right + labelGap && lx + labelW > r.left - labelGap)){
      row++;
    }
    if(row >= labelRows){
      row = labelRows - 1;
      lx = clamp(lx, padLForFloatingLabels(), w - 18*devicePixelRatio - labelW);
    }
    const ly = labelTop + row * (labelH + labelGap);
    placedLabels.push({row, left:lx, right:lx+labelW});
    ctx.fillStyle='rgba(2, 6, 23, 0.90)';
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1*devicePixelRatio;
    ctx.beginPath();
    ctx.roundRect(lx, ly, labelW, labelH, 9*devicePixelRatio);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#fde68a';
    ctx.save();
    ctx.beginPath();
    ctx.rect(lx+6*devicePixelRatio, ly, labelW-12*devicePixelRatio, labelH);
    ctx.clip();
    ctx.fillText(text, lx+labelW/2, ly+labelH/2);
    ctx.restore();
  }
  ctx.restore();
}

function padLForFloatingLabels(){
  return 54 * devicePixelRatio;
}

function drawRouteMap(){
  if(!routeMapCanvas || !routeMapCtx) return;
  const c = routeMapCanvas;
  const mctx = routeMapCtx;
  const w = c.width, h = c.height;
  if(w <= 0 || h <= 0) return;
  mctx.clearRect(0, 0, w, h);
  mctx.fillStyle = '#020617';
  mctx.fillRect(0, 0, w, h);
  if(!route.length) return;

  const dpr = devicePixelRatio || 1;
  const pad = 18 * dpr;
  const meanLatBase = route.reduce((sum, p) => sum + p.lat, 0) / route.length;
  const meanLat = Number.isFinite(lastGpsLat) ? (meanLatBase + lastGpsLat) / 2 : meanLatBase;
  const lonScale = Math.max(0.15, Math.cos(rad(meanLat)));
  const startDist = mapFitAll ? 0 : clamp(viewStart, 0, totalDist);
  const endDist = mapFitAll ? totalDist : clamp(viewEnd, startDist, totalDist);
  const mapRoute = [routeSampleAtDist(startDist)]
    .concat(route.filter(p => p.dist > startDist && p.dist < endDist))
    .concat([routeSampleAtDist(endDist)]);
  const projected = mapRoute
    .filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon))
    .map(p => ({x:p.lon * lonScale, y:p.lat, dist:p.dist}));
  const boundsProjected = projected.slice();
  if(mapFitAll && Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    boundsProjected.push({x:lastGpsLon * lonScale, y:lastGpsLat, dist:null, gps:true});
  }
  if(projected.length < 2) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const p of boundsProjected){
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  let spanX = maxX - minX, spanY = maxY - minY;
  if(spanX <= 0) spanX = 1e-9;
  if(spanY <= 0) spanY = 1e-9;
  const scale = Math.min((w - 2*pad) / spanX, (h - 2*pad) / spanY);
  const drawW = spanX * scale, drawH = spanY * scale;
  const ox = (w - drawW) / 2;
  const oy = (h - drawH) / 2;
  const mapPoint = p => ({
    x: ox + (p.lon * lonScale - minX) * scale,
    y: oy + (maxY - p.lat) * scale
  });
  const mapLatLon = (lat, lon) => ({
    x: ox + (lon * lonScale - minX) * scale,
    y: oy + (maxY - lat) * scale
  });
  const mapProjected = p => ({
    x: ox + (p.x - minX) * scale,
    y: oy + (maxY - p.y) * scale
  });

  function strokeRoute(points, color, widthPx){
    if(points.length < 2) return;
    mctx.beginPath();
    for(let i=0;i<points.length;i++){
      const mp = mapProjected(points[i]);
      if(i === 0) mctx.moveTo(mp.x, mp.y);
      else mctx.lineTo(mp.x, mp.y);
    }
    mctx.strokeStyle = color;
    mctx.lineWidth = widthPx * dpr;
    mctx.lineJoin = 'round';
    mctx.lineCap = 'round';
    mctx.stroke();
  }

  strokeRoute(projected, '#22c55e', 2.2);
  for(const seg of asphaltIntervals){
    const s = Math.max(startDist, seg.start);
    const e = Math.min(endDist, seg.end);
    if(e <= s + 1) continue;
    const segPoints = [routeSampleAtDist(s)]
      .concat(route.filter(p => p.dist > s && p.dist < e))
      .concat([routeSampleAtDist(e)])
      .filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon))
      .map(p => ({x:p.lon * lonScale, y:p.lat, dist:p.dist}));
    strokeRoute(segPoints, '#94a3b8', 2.2);
  }

  const points = allVisiblePoints().filter(pt => pt.dist >= startDist && pt.dist <= endDist);
  mctx.font = '700 '+(13*dpr)+'px system-ui';
  mctx.textAlign = 'center';
  mctx.textBaseline = 'bottom';
  for(const pt of points){
    if(!Number.isFinite(pt.lat) || !Number.isFinite(pt.lon)) continue;
    const mp = mapPoint(pt);
    mctx.fillStyle = '#fbbf24';
    mctx.beginPath();
    mctx.arc(mp.x, mp.y, 4.5*dpr, 0, Math.PI*2);
    mctx.fill();
    const label = String(pt.label || '').trim();
    if(label){
      const textW = Math.min(mctx.measureText(label).width + 12*dpr, 150*dpr);
      const bx = clamp(mp.x - textW/2, 4*dpr, w - textW - 4*dpr);
      const by = clamp(mp.y - 28*dpr, 4*dpr, h - 24*dpr);
      mctx.fillStyle = 'rgba(2, 6, 23, 0.86)';
      mctx.strokeStyle = '#fbbf24';
      mctx.lineWidth = 1*dpr;
      mctx.beginPath();
      mctx.roundRect(bx, by, textW, 20*dpr, 6*dpr);
      mctx.fill();
      mctx.stroke();
      mctx.save();
      mctx.beginPath();
      mctx.rect(bx+4*dpr, by, textW-8*dpr, 20*dpr);
      mctx.clip();
      mctx.fillStyle = '#fde68a';
      mctx.fillText(label, bx + textW/2, by + 16*dpr);
      mctx.restore();
    }
  }

  const marker = route[markerIdx];
  if(marker && marker.dist >= startDist && marker.dist <= endDist){
    const mp = mapPoint(marker);
    mctx.strokeStyle = '#020617';
    mctx.lineWidth = 3*dpr;
    mctx.fillStyle = markerColor();
    mctx.beginPath();
    mctx.arc(mp.x, mp.y, 8*dpr, 0, Math.PI*2);
    mctx.fill();
    mctx.stroke();
  }

  const fs = forecastStats();
  if(fs && fs.endDist >= startDist && fs.endDist <= endDist){
    const fp = routeSampleAtDist(fs.endDist);
    if(fp){
      const mp = mapPoint(fp);
      mctx.strokeStyle = '#020617';
      mctx.lineWidth = 3*dpr;
      mctx.fillStyle = '#a78bfa';
      mctx.beginPath();
      mctx.arc(mp.x, mp.y, 7*dpr, 0, Math.PI*2);
      mctx.fill();
      mctx.stroke();
    }
  }

  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    const gp = mapLatLon(lastGpsLat, lastGpsLon);
    const size = 8 * dpr;
    mctx.strokeStyle = '#ffffff';
    mctx.lineWidth = 2.4 * dpr;
    mctx.beginPath();
    mctx.moveTo(gp.x - size, gp.y);
    mctx.lineTo(gp.x + size, gp.y);
    mctx.moveTo(gp.x, gp.y - size);
    mctx.lineTo(gp.x, gp.y + size);
    mctx.stroke();
  }
}

function routeIndexAtOrNearDistForward50(dist){
  if(!route || !route.length) return null;
  let best = 0;
  let bestD = Math.abs(route[0].dist - dist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - dist);
    if(d < bestD){
      bestD = d;
      best = i;
    }
  }
  return best;
}

function scheduleTestStep(){
  if(!testPlayback.timer || testPlayback.idx >= testPlayback.points.length){
    stopTestPlayback();
    statusEl.textContent = 'TEST zakończony.';
    return;
  }
  const p = testPlayback.points[testPlayback.idx];
  applyTestPoint(p);
  testPlayback.idx += 1;
  if(testPlayback.idx >= testPlayback.points.length){
    scheduleTestStep();
    return;
  }
  const next = testPlayback.points[testPlayback.idx];
  const dt = Math.max(80, Math.min(2000, (next.t - p.t) / testPlayback.speed));
  testPlayback.timer = setTimeout(scheduleTestStep, dt);
}
function buildTestPointsFromSegmentTimes(samples){
  if(!Array.isArray(samples) || samples.length < 2) return false;
  const out = [];
  let currentTime = Date.now();
  let usedTimedSteps = 0;
  out.push({lat:samples[0].lat, lon:samples[0].lon, ele:samples[0].ele, t:currentTime});
  for(let i=1; i<samples.length; i++){
    const prev = samples[i-1];
    const cur = samples[i];
    let dt = null;
    if(prev._timeSeg && cur._timeSeg && prev._timeSeg === cur._timeSeg && Number.isFinite(prev.t) && Number.isFinite(cur.t) && cur.t > prev.t){
      dt = cur.t - prev.t;
      usedTimedSteps += 1;
    } else {
      const spanKm = Math.max(0, cur.dist - prev.dist) / 1000;
      if(spanKm > 0.001){
        const speed = etaSpeedKmhForInterval(prev.dist, cur.dist);
        const kmh = speed && Number.isFinite(speed.kmh) && speed.kmh > 0 ? speed.kmh : (manualSpeedKmh() || 10);
        dt = (spanKm / kmh) * 3600000;
      } else {
        dt = 0;
      }
    }
    currentTime += Math.max(0, dt || 0);
    out.push({lat:cur.lat, lon:cur.lon, ele:cur.ele, t:currentTime});
  }
  return usedTimedSteps ? out : null;
}
function buildTestPointsFromLoadedInputs(){
  if(!route.length) return [];
  const samples = [];
  const stepM = Math.max(50, Math.min(150, totalDist / 500));
  for(let d=0; d<=totalDist; d += stepM){
    const p = routeSampleAtDist(d);
    if(!p) continue;
    samples.push({lat:p.lat, lon:p.lon, ele:p.ele, dist:d, t:p.t, _timeSeg:p._timeSeg});
  }
  const last = routeSampleAtDist(totalDist);
  if(last && (!samples.length || samples[samples.length-1].lat !== last.lat || samples[samples.length-1].lon !== last.lon)){
    samples.push({lat:last.lat, lon:last.lon, ele:last.ele, dist:totalDist, t:last.t, _timeSeg:last._timeSeg});
  }
  const gpxTimePoints = buildTestPointsFromSegmentTimes(samples);
  if(gpxTimePoints){
    testPlayback.usesGpxTime = true;
    return gpxTimePoints;
  }

  testPlayback.usesGpxTime = false;
  const points = [];
  let t = Date.now();
  let lastDist = 0;
  for(const p of samples){
    const d = p.dist;
    if(points.length){
      const spanKm = Math.max(0, d - lastDist) / 1000;
      const speed = etaSpeedKmhForInterval(lastDist, d);
      const kmh = speed && Number.isFinite(speed.kmh) && speed.kmh > 0 ? speed.kmh : (manualSpeedKmh() || 10);
      t += (spanKm / kmh) * 3600000;
    }
    points.push({lat:p.lat, lon:p.lon, ele:p.ele, t});
    lastDist = d;
  }
  return points;
}

function startPinchIfPossible(){
  if(activePointers.size < 2 || !route.length) return;
  const pts = Array.from(activePointers.values()).slice(0,2);
  const dx = Math.abs(pts[0].x - pts[1].x);
  const centerX = (pts[0].x + pts[1].x) / 2;
  pinchState = {startDx: Math.max(10, dx), startZoom: xZoom, keepDist: distFromCanvasX(centerX)};
  dragState = null;
}
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size === 1 && canMovePositionManually() && isPositionHandle(e.clientX, e.clientY)){
    positionDragState={id:e.pointerId};
    setPositionFromClientX(e.clientX);
    forecastDragState=null;
    dragState=null;
    e.preventDefault();
    return;
  }
  if(activePointers.size === 1 && isForecastHandle(e.clientX, e.clientY)){
    forecastDragState={id:e.pointerId};
    setForecastFromClientX(e.clientX);
    dragState=null;
    e.preventDefault();
    return;
  }
  if(activePointers.size === 1){
    dragState={id:e.pointerId, x:e.clientX, start:viewStart, end:viewEnd};
  } else if(activePointers.size === 2){
    forecastDragState=null;
    positionDragState=null;
    startPinchIfPossible();
  }
});
canvas.addEventListener('pointermove', e=>{
  if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(positionDragState && positionDragState.id===e.pointerId){
    setPositionFromClientX(e.clientX);
    e.preventDefault();
    return;
  }

  if(forecastDragState && forecastDragState.id===e.pointerId){
    setForecastFromClientX(e.clientX);
    e.preventDefault();
    return;
  }

  if(pinchState && activePointers.size >= 2){
    const pts = Array.from(activePointers.values()).slice(0,2);
    const dx = Math.abs(pts[0].x - pts[1].x);
    const ratio = clamp(dx / pinchState.startDx, 0.25, 4);
    applyXZoom(pinchState.startZoom * ratio, pinchState.keepDist);
    return;
  }

  if(!dragState || dragState.id!==e.pointerId || xZoom<=1) return;
  const rect=canvas.getBoundingClientRect();
  const dx=e.clientX-dragState.x;
  const dd=-(dx/rect.width)*(dragState.end-dragState.start);
  const width=dragState.end-dragState.start;
  viewStart=clamp(dragState.start+dd,0,Math.max(0,totalDist-width));
  viewEnd=viewStart+width;
  autoCenter=false;
  draw();
});
function endPointer(e){

  }
  if(forecastDragState && forecastDragState.id===e.pointerId){
    forecastDragState=null;
    updateInfo(null, null, true);
    draw();
    return;
  }
  if(pinchState){
    pinchState = null;
    if(activePointers.size === 1){
      const remaining = Array.from(activePointers.entries())[0];
      if(remaining){
        dragState = {id: remaining[0], x: remaining[1].x, start:viewStart, end:viewEnd};
      }
    }
    return;
  }
  if(dragState && dragState.id===e.pointerId) dragState=null;
}

function setMarkerByKmV54(km){
  if(!route || !route.length) return;
  let targetDist = Number(km) * 1000;
  if(!Number.isFinite(targetDist)) return;
  targetDist = Math.max(0, Math.min(totalDist || targetDist, targetDist));

  let best = 0;
  let bestD = Math.abs(route[0].dist - targetDist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - targetDist);
    if(d < bestD){ bestD = d; best = i; }
  }

  markerIdx = best;

  // Synchronizacja zgrubnego kilometrażu z suwakiem.
  if(typeof roughKm !== "undefined") roughKm = route[best].dist / 1000;
  if(typeof currentGpxKm !== "undefined") currentGpxKm = route[best].dist / 1000;
  if(typeof lastProjectedKm !== "undefined") lastProjectedKm = route[best].dist / 1000;

  if(typeof keepMarkerVisible === "function") keepMarkerVisible();
  if(typeof draw === "function") draw();
  if(typeof updateInfo === "function") updateInfo();
}

function updateSliderFromMarkerV54(){
  const s = getPositionSliderEl();
  if(!s || !route || !route.length || markerIdx == null || !route[markerIdx]) return;
  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const value = total > 0 ? Math.round((route[markerIdx].dist / total) * 1000) : 0;
  s.value = String(Math.max(0, Math.min(1000, value)));
}

// ===== v54: suwak pozycji 0-1000 =====
let suppressSliderUpdateV54 = false;

function nearestRouteIndexByDistanceV54(distMeters){
  if(!route || !route.length) return 0;
  let lo = 0;
  let hi = route.length - 1;

  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < distMeters) lo = mid + 1;
    else hi = mid;
  }

  if(lo > 0 && Math.abs(route[lo-1].dist - distMeters) < Math.abs(route[lo].dist - distMeters)){
    return lo - 1;
  }
  return lo;
}

function setMarkerByDistanceV54(distMeters, source){
  if(!route || !route.length) return;
  if(source !== "gps" && source !== "reset" && !canMovePositionManually()) return;

  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const d = Math.max(0, Math.min(total, Number(distMeters) || 0));
  const idx = nearestRouteIndexByDistanceV54(d);
  if(source !== "gps" && source !== "reset"){
    preserveForecastTargetForManualPosition(route[idx].dist);
    resetEtaDisplaySmoothing();
  }

  markerIdx = idx;
  if(source === "gps"){
    recordSimpleEtaRealPosition(route[idx].dist);
    if(etaDisplayState.seconds === null) resetEtaDisplaySmoothing();
  }

  // Synchronizacja zmiennych używanych przez różne wersje aplikacji.
  try { currentGpxKm = route[idx].dist / 1000; } catch(e) {}
  try { lastProjectedKm = route[idx].dist / 1000; } catch(e) {}
  try { roughKm = route[idx].dist / 1000; } catch(e) {}

  // Widok X: nie skaczemy agresywnie, tylko pilnujemy, żeby marker był widoczny.
  if(typeof ensureMarkerVisible === "function") ensureMarkerVisible();
  else if(typeof keepMarkerVisible === "function") keepMarkerVisible();
  else {
    const width = viewEnd - viewStart;
    if(route[idx].dist < viewStart) {
      viewStart = Math.max(0, route[idx].dist - width * 0.15);
      viewEnd = viewStart + width;
    } else if(route[idx].dist > viewEnd) {
      viewEnd = Math.min(total, route[idx].dist + width * 0.15);
      viewStart = viewEnd - width;
    }
  }

  updatePositionSliderV54();
  if(typeof updateInfo === "function") updateInfo(null, null, source !== "gps" || etaDisplayState.seconds === null);
  if(typeof draw === "function") draw();
}

function updatePositionSliderV54(){
  const s = document.getElementById("positionSlider");
  if(!s || !route || !route.length || markerIdx == null || !route[markerIdx]) return;
  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const value = total > 0 ? Math.round((route[markerIdx].dist / total) * 1000) : 0;
  suppressSliderUpdateV54 = true;
  s.value = String(Math.max(0, Math.min(1000, value)));
  suppressSliderUpdateV54 = false;
}

function bindPositionSliderV54(){
  const s = document.getElementById("positionSlider");
  if(!s || s.dataset.boundV54 === "1") return;
  s.dataset.boundV54 = "1";
  s.min = "0";
  s.max = "1000";
  s.step = "1";

  const handler = function(){
    if(suppressSliderUpdateV54) return;
    if(!canMovePositionManually()) return;
    if(!route || !route.length) return;
    const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
    const frac = (Number(s.value) || 0) / 1000;
    setMarkerByDistanceV54(frac * total, "slider");
  };

  s.addEventListener("input", handler);
  s.addEventListener("change", handler);
  s.addEventListener("pointerdown", e => e.stopPropagation());
  s.addEventListener("touchstart", e => e.stopPropagation(), {passive:true});
}

// ===== v54: stabilne uruchamianie GPS =====

function setGpsStatusV54(text){
  const el = document.getElementById("status");
  if(el) el.textContent = text;
}

function applyGpsPositionV54(pos){
  if(!pos || !pos.coords) return;
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;

  setGpsStatusV54("GPS: włączony");
  updateGpsButtonState();

  // Użyj istniejącej logiki projektu, jeżeli działa.
  if(typeof handleGpsPosition === "function"){
    handleGpsPosition(pos);
    return;
  }
  if(typeof handlePosition === "function"){
    handlePosition(pos);
    return;
  }
  if(typeof updateFromGps === "function"){
    updateFromGps(lat, lon, pos.coords.accuracy);
    return;
  }

  // Fallback: znajdź najbliższy punkt GPX po współrzędnych.
  if(route && route.length){
    let best = 0;
    let bestD = Infinity;
    for(let i=0; i<route.length; i++){
      const p = route[i];
      if(!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
      const dy = (p.lat - lat) * 111320;
      const dx = (p.lon - lon) * 111320 * Math.cos(lat * Math.PI / 180);
      const d2 = dx*dx + dy*dy;
      if(d2 < bestD){ bestD = d2; best = i; }
    }
    markerIdx = best;
    setMarkerByDistanceV54(route[best].dist, "gps");
  }
}

function startGpsV54(){
  if(!navigator.geolocation){
    setGpsStatusV52("GPS: brak obsługi w przeglądarce");
    updateGpsButtonState();
    return;
  }

  if(gpsWatchIdV54 !== null){
    navigator.geolocation.clearWatch(gpsWatchIdV54);
    gpsWatchIdV54 = null;
    positionDragState = null;
    setGpsStatusV52("GPS wyłączony.");
    updateGpsButtonState();
    return;
  }

  setGpsStatusV52("GPS: uruchamianie");
  try{
    gpsWatchIdV54 = navigator.geolocation.watchPosition(
      applyGpsPositionV54,
      err => {
        setGpsStatusV52("GPS: błąd " + (err && err.message ? err.message : ""));
      },
      {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
    );
    updateGpsButtonState();

    navigator.geolocation.getCurrentPosition(
      applyGpsPositionV54,
      err => {
        setGpsStatusV52("GPS: błąd " + (err && err.message ? err.message : ""));
      },
      {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
    );
  } catch(e){
    setGpsStatusV52("GPS: błąd " + e.message);
    updateGpsButtonState();
  }
}

function bindGpsButtonV54(){
  const b = document.getElementById("gpsBtn");
  if(b && b.dataset.boundGpsV54 !== "1"){
    b.dataset.boundGpsV54 = "1";
    b.addEventListener("click", startGpsV54);
  }
}

// ===== v54: stabilne wczytywanie GPX i waypointów =====
function haversineMetersV54(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function cumulativeRouteV54(points){
  let dist = 0;
  for(let i=0; i<points.length; i++){
    if(i > 0){
      dist += haversineMetersV54(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
    }
    points[i].dist = dist;
  }
  return dist;
}

function nearestRouteIndexToLatLonV54(lat, lon){
  if(!route || !route.length) return 0;
  let best = 0;
  let bestD = Infinity;
  for(let i=0; i<route.length; i++){
    const p = route[i];
    if(!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
    const d = haversineMetersV54(lat, lon, p.lat, p.lon);
    if(d < bestD){
      bestD = d;
      best = i;
    }
  }
  return best;
}

function nearestRouteIndexByDistV54(distMeters){
  if(!route || !route.length) return 0;
  let lo = 0;
  let hi = route.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < distMeters) lo = mid + 1;
    else hi = mid;
  }
  if(lo > 0 && Math.abs(route[lo-1].dist - distMeters) < Math.abs(route[lo].dist - distMeters)) return lo-1;
  return lo;
}

function parseGpxTextV54(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  const parserError = doc.querySelector("parsererror");
  if(parserError) throw new Error("Nieprawidłowy format XML/GPX.");

  const readPt = el => {
    const lat = Number(el.getAttribute("lat"));
    const lon = Number(el.getAttribute("lon"));
    const eleEl = el.querySelector("ele");
    const ele = eleEl ? Number(eleEl.textContent) : 0;
    return {lat, lon, ele: Number.isFinite(ele) ? ele : 0, dist: 0};
  };

  let pts = Array.from(doc.querySelectorAll("trkpt")).map(readPt)
    .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));

  if(pts.length < 2){
    pts = Array.from(doc.querySelectorAll("rtept")).map(readPt)
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }

  if(pts.length < 2){
    throw new Error("W pliku GPX nie znaleziono śladu trasy trkpt ani rtept.");
  }

  const wpts = Array.from(doc.querySelectorAll("wpt")).map(w => {
    const lat = Number(w.getAttribute("lat"));
    const lon = Number(w.getAttribute("lon"));
    const name = (w.querySelector("name")?.textContent || w.querySelector("cmt")?.textContent || w.querySelector("desc")?.textContent || "").trim();
    return {lat, lon, name};
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon) && p.name);

  return {pts, wpts};
}

function applyRouteV54(points, waypoints, sourceName){
  clearAsphaltIntervals();
  route = points;
  totalDist = cumulativeRouteV54(route);

  markerIdx = 0;
  viewStart = 0;
  viewEnd = totalDist;
  forecastTargetDist=NaN;
  localStorage.removeItem('profilGpsForecastTargetDist');
  setSimpleEtaBaseline(route[markerIdx] ? route[markerIdx].dist : 0);

  if(typeof xZoom !== "undefined") xZoom = 1;
  if(typeof yStretch !== "undefined") yStretch = 1;

  const elevations = route.map(p => p.ele).filter(Number.isFinite);
  if(elevations.length){
    const minEle = Math.min(...elevations);
    const maxEle = Math.max(...elevations);
    const pad = Math.max(20, (maxEle - minEle) * 0.12);
    baseYMin = minEle - pad;
    baseYMax = maxEle + pad;
  }

  // Waypointy z GPX jako punkty opisowe na profilu.
  const mapped = [];
  for(const w of (waypoints || [])){
    const idx = nearestRouteIndexToLatLonV54(w.lat, w.lon);
    mapped.push({
      name: w.name,
      label: w.name,
      dist: route[idx].dist,
      ele: route[idx].ele,
      lat: w.lat,
      lon: w.lon
    });
  }

  // Obsłuż różne nazwy zmiennych z poprzednich wersji.
  try { gpxNotePoints = mapped; } catch(e) {}
  try { userPoints = mapped; } catch(e) {}
  try { routePoints = mapped; } catch(e) {}
  window.gpxNotePoints = mapped;

  const slider = document.getElementById("positionSlider") || document.querySelector('input[type="range"]');
  if(slider){
    slider.min = "0";
    slider.max = "1000";
    slider.step = "1";
    slider.value = "0";
  }

  if(typeof bindPositionSliderV54 === "function") bindPositionSliderV54();
  if(typeof bindPositionSliderV54 === "function") bindPositionSliderV54();
  if(typeof updateInfo === "function") updateInfo();
  if(typeof draw === "function") draw();

  const status = document.getElementById("status");
  if(status) status.textContent = "GPX wczytany: " + (sourceName || "plik") + " (" + (totalDist/1000).toFixed(2) + " km)";
}

async function handleGpxFileV54(file){
  if(!file) return;
  const text = await file.text();
  const parsed = parseGpxTextV54(text);
  applyRouteV54(parsed.pts, parsed.wpts, file.name);
}

function bindGpxInputV54(){
  const inputs = Array.from(document.querySelectorAll('input[type="file"]'));
  const gpxInput = inputs.find(i => (i.accept || "").toLowerCase().includes("gpx")) || inputs[0];

  if(!gpxInput || gpxInput.dataset.boundGpxV54 === "1") return;
  gpxInput.dataset.boundGpxV54 = "1";

  gpxInput.addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    try{
      await handleGpxFileV54(file);
    } catch(err){
      const status = document.getElementById("status");
      if(status) status.textContent = "Błąd wczytywania GPX: " + err.message;
      alert("Błąd wczytywania GPX: " + err.message);
    }
  });
}
