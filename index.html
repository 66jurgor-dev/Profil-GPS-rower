<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil trasy GPS offline</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --line:#38bdf8; --accent:#f59e0b; --bad:#ef4444; --ok:#22c55e; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
header { padding:12px 14px; background:#020617; border-bottom:1px solid #1f2937; }
h1 { font-size:18px; margin:0 0 4px 0; }
.small { color:var(--muted); font-size:12px; }
main { padding:10px; display:grid; gap:10px; }
.panel { background:var(--panel); border:1px solid #1f2937; border-radius:14px; padding:10px; }
.info-panel { display:flex; flex-direction:column; gap:10px; }
.info-panel .controls { margin-top:auto; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button, label.file { color:var(--text); border:1px solid #374151; padding:9px 11px; border-radius:10px; font-size:14px; }
button.blue, label.file.blue { background:#2563eb; border-color:#1d4ed8; }
button.green { background:#16a34a; border-color:#15803d; }
button.orange { background:#f59e0b; border-color:#d97706; color:#111827; font-weight:700; }
button.red { background:#dc2626; border-color:#b91c1c; }
button:active, label.file:active { transform:translateY(1px); }
input[type=file] { display:none; }
input.speed-input { width:100%; margin-top:6px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:8px; font-size:18px; font-weight:700; }
input.point-input { min-width:160px; flex:1 1 180px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:9px 11px; font-size:14px; }
canvas { width:100%; height:46vh; min-height:280px; display:block; background:#020617; border-radius:12px; touch-action:none; }
.grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
.tile { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:9px; }
.tile b { display:block; font-size:18px; margin-top:3px; }
.tile b.coord { font-size:16px; letter-spacing:0.2px; }
.status { font-size:14px; color:var(--muted); }
.ok { color:var(--ok); } .bad { color:var(--bad); } .accent { color:var(--accent); }
.range { width:100%; }
@media (orientation:landscape) { main { grid-template-columns: 1.6fr 1fr; } canvas { height:72vh; } }

.btn-blue { background:#2563eb; color:white; }

/* ===== v54: większy interfejs terenowy ===== */
button,
.btn,
input[type="button"],
input[type="submit"] {
  min-height: 3.1em !important;
  padding-top: 0.95em !important;
  padding-bottom: 0.95em !important;
  font-size: 1.05rem !important;
  line-height: 1.25 !important;
}

.info-grid,
.infoPanel,
.info-panel,
.stats,
.data-grid,
.panel-info {
  font-size: 1.25rem !important;
}

.info-grid *,
.infoPanel *,
.info-panel *,
.stats *,
.data-grid *,
.panel-info *,
.value,
.info-value,
.stat-value {
  font-size: 1.25rem !important;
}

input,
select {
  min-height: 2.7em !important;
  font-size: 1.2rem !important;
}

.forecast-label,
.prognoza-label,
.forecast-label-draggable {
  font-size: 1.35rem !important;
}


/* ===== v54: przyciski centralnie w dwóch rzędach ===== */
.controls, .button-row, .buttons, .actions, .toolbar, .bottom-buttons {
  display: flex !important;
  flex-wrap: wrap !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 0.55rem !important;
  max-width: 920px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

.controls button, .button-row button, .buttons button, .actions button, .toolbar button, .bottom-buttons button,
label[for="gpxFileInput"], label[for="gpxInput"], .gpx-button, .file-button, .file-label, label:has(input[type="file"]) {
  min-height: 3.1em !important;
  padding-top: 0.95em !important;
  padding-bottom: 0.95em !important;
  font-size: 1.05rem !important;
  line-height: 1.25 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* v54: Nachylenie 50 m jako normalny kafelek danych */
#slopeForward50Value {
  font-weight: 700 !important;
}


/* ===== v54: jednakowa szerokość przycisków ===== */
.controls button,
.button-row button,
.buttons button,
.actions button,
.toolbar button,
.bottom-buttons button,
label[for="gpxFileInput"],
label[for="gpxInput"],
.file-label,
.gpx-button,
.file-button,
label:has(input[type="file"]) {
  width: 10.8rem !important;
  min-width: 10.8rem !important;
  max-width: 10.8rem !important;
  box-sizing: border-box !important;
  text-align: center !important;
}


/* ===== v54: usunięcie tekstów pomocniczych ===== */
.hint,
.help,
.status-text,
.instruction,
.instructions,
.note,
.notes {
  display: none !important;
}


/* ===== v54: pasek statusu GPS ===== */
#status.status-bar,
#status {
  display: block !important;
  width: 100%;
  box-sizing: border-box;
  margin: 0 0 0.65rem 0;
  padding: 0.45rem 0.65rem;
  border: 1px solid rgba(148,163,184,0.25);
  border-radius: 0.65rem;
  background: rgba(15,23,42,0.92);
  color: #cbd5e1;
  font-size: 0.95rem;
  line-height: 1.25;
}

</style>
</head>
<body>
<header>
  <h1>Profil trasy GPS offline</h1>
</header>
<main>
<section class="panel">
  <canvas id="profile"></canvas>
  <input id="positionSlider" type="range" class="range" min="0" max="1000" step="1" value="0">
</section>
<section class="panel info-panel">
<div class="grid">
    <div class="tile">Dystans<b id="roughKm">-</b></div>
    <div class="tile">Pozostało<b id="left">-</b></div>
    <div class="tile">Koniec o:<b id="eta">-</b></div>
    <div class="tile">Czas do:<b id="timeToForecast">-</b></div>
    <div class="tile">Wznios DO<b id="ascentToForecast">-</b></div>
    <div class="tile">Wznios PO<b id="ascentAfterForecast">-</b></div>
    <div class="tile">Wysokość z GPX<b id="ele">-</b></div>
    <div class="tile">Prędkość z aplikacji<b id="appSpeed">-</b></div>
    <div class="tile">Nachylenie 50 m<b id="slopeForward50Value">-</b></div>

    <div class="tile">Prędkość [km/h]<input id="manualSpeed" class="speed-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0 = auto"></div>
  </div>
<div class="controls">
<label class="file blue">Wczytaj GPX<input id="file" type="file" accept=".gpx,application/gpx+xml,text/xml"></label>
    <button id="gpsBtn" class="blue">Start GPS</button>
    <button id="fitBtn" class="green">Pokaż całość</button>
    <button id="twoKmBtn" class="green">2 km</button>
      <button id="yUpBtn" onclick="yUp()" class="green">Y UP</button>
      <button id="yDownBtn" onclick="yDown()" class="green">Y DOWN</button>
    <button id="btnResetCzasu" class="red" onclick="resetCzasuAplikacji()">Reset</button>
  </div>
</section>
</main>
<div id="status"></div>
<script src="trasa.js"></script>
<script>


function safeEl(id){
  return document.getElementById(id);
}
function safeAddClick(id, handler){
  const el = document.getElementById(id);
  if (el) el.addEventListener('click', handler);
}

let route = [];
let totalDist = 0;
let markerIdx = 0;
let lastGpsDistance = null;
let lastGpsAccuracy = null;
let lastGpsLat = null;
let lastGpsLon = null;
let roughTrack = {signature:null, dist:0, points:[]};
const ROUGH_KEY = 'profilGpsRoughTrackV12';
let speedHistory = {signature:null, points:[]};
const SPEED_KEY = 'profilGpsSpeedHistoryV1';
let manualLockUntil = 0;
let manualLockCenterDist = null;
let gpxNotePoints = [];
const MANUAL_LOCK_MS = 30 * 60 * 1000;
const MANUAL_LOCK_WINDOW_M = 2500;

function formatCoordValue(value, digitsBefore){
  if(!Number.isFinite(value)) return '-';
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value);
  let s = abs.toFixed(6);
  const parts = s.split('.');
  parts[0] = parts[0].padStart(digitsBefore, '0');
  return sign + parts[0] + '.' + parts[1];
}
function formatGpxCoord(p){
  if(!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lon)) return '-';
  return formatCoordValue(p.lat, 2) + ' ' + formatCoordValue(p.lon, 3);
}

let watchId = null;
let wakeLock = null;
let trackingInitialized = false;
let viewStart = 0;
let viewEnd = 0;
let xZoom = 1;
let yStretch = 1;
let autoCenter = false;
let dragState = null;
let pinchState = null;
let forecastOffsetRatio = Number(localStorage.getItem('profilGpsForecastOffsetRatio') || '0.25');
let forecastDragState = null;
let forecastLabelHit = null;
let autoYActive = false;
let autoYMin = null;
let autoYMax = null;
let baseYMin = null;
let baseYMax = null;
const activePointers = new Map();
const canvas = document.getElementById('profile');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const sim = document.getElementById('sim') || document.getElementById('positionSlider');
function rad(x){ return x*Math.PI/180; }
function hav(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const lat1=rad(a.lat), lat2=rad(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function currentRouteSignature(){
  if(!route.length) return null;
  const first = route[0], last = route[route.length-1];
  return [
    route.length,
    Math.round(totalDist),
    first.lat.toFixed(5), first.lon.toFixed(5),
    last.lat.toFixed(5), last.lon.toFixed(5)
  ].join('|');
}
function loadRoughTrack(){
  const sig = currentRouteSignature();
  try{
    const raw = localStorage.getItem(ROUGH_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if(obj && obj.signature === sig && Number.isFinite(obj.dist)){
      roughTrack = {signature:sig, dist:obj.dist, points:Array.isArray(obj.points)?obj.points:[]};
    } else {
      roughTrack = {signature:sig, dist:0, points:[]};
    }
  }catch(e){
    roughTrack = {signature:sig, dist:0, points:[]};
  }
}
function saveRoughTrack(){
  try{ localStorage.setItem(ROUGH_KEY, JSON.stringify(roughTrack)); }catch(e){}
}
function loadSpeedHistory(){
  const sig = currentRouteSignature();
  try{
    const raw = localStorage.getItem(SPEED_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if(obj && obj.signature === sig && Array.isArray(obj.points)){
      speedHistory = {signature:sig, points:obj.points.filter(p => Number.isFinite(p.t) && Number.isFinite(p.dist))};
    } else {
      speedHistory = {signature:sig, points:[]};
    }
  }catch(e){
    speedHistory = {signature:sig, points:[]};
  }
}
function saveSpeedHistory(){
  try{ localStorage.setItem(SPEED_KEY, JSON.stringify(speedHistory)); }catch(e){}
}
function recordSpeedPosition(dist, source='gps'){
  if(!route.length || !Number.isFinite(dist)) return;
  if(speedHistory.signature !== currentRouteSignature()) loadSpeedHistory();
  const now = Date.now();
  dist = clamp(dist, 0, totalDist);
  const last = speedHistory.points.length ? speedHistory.points[speedHistory.points.length-1] : null;

  // Ręczne ustawienie pozycji synchronizuje obliczenia.
  // Jeżeli korekta cofa kilometraż, zaczynamy nową serię, aby nie zaniżać/zawyżać średniej.
  if(source === 'manual'){
    if(last && dist < last.dist - 500){
      speedHistory.points = [];
    }
    speedHistory.points.push({t:now, dist, source});
  } else if(source === 'reset'){
    speedHistory.points = [{t:now, dist, source}];
  } else {
    if(last){
      const dt = (now - last.t) / 1000;
      const dd = dist - last.dist;
      if(Math.abs(dd) < 20 && dt < 180) return;
      if(dd < -300) return;
      if(dd > 8000) return;
    }
    speedHistory.points.push({t:now, dist, source});
  }

  if(speedHistory.points.length > 200) speedHistory.points = speedHistory.points.slice(-200);
  saveSpeedHistory();
}

function routeSpecificKey(baseKey){
  const sig = currentRouteSignature() || 'none';
  return baseKey + '|' + sig;
}
function allVisiblePoints(){
  return [...gpxNotePoints];
}

function clearGpxNotePoints(){
  gpxNotePoints = [];
}

function addGpxNotePoints(notePoints){
  gpxNotePoints = [];
  if(!Array.isArray(notePoints) || !route.length) return;
  for(const p of notePoints){
    if(!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lon) || !p.label) continue;
    const n = nearestGlobal(p.lat, p.lon);
    // Waypoint może leżeć minimalnie obok śladu. Zostawiamy go, ale zapisujemy odległość kontrolną.
    gpxNotePoints.push({
      label:String(p.label).trim(),
      dist:route[n.idx].dist,
      idx:n.idx,
      off:n.d,
      lat:p.lat,
      lon:p.lon
    });
  }
  gpxNotePoints.sort((a,b)=>a.dist-b.dist);
}

function escapeHtml(text){
  return String(text).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
function resetRoughTrack(dist=0){
  roughTrack = {signature:currentRouteSignature(), dist:Math.max(0, dist||0), points:[]};
  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    roughTrack.points.push({lat:lastGpsLat, lon:lastGpsLon, t:Date.now(), dist:roughTrack.dist});
  }
  saveRoughTrack();
  updateInfo();
}
function resetCzasuAplikacji(){
  if(!route.length) return;

  speedHistory = {signature:currentRouteSignature(), points:[]};
  saveSpeedHistory();

  let resetSource = 'slider';
  let gpsDistance = null;
  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    const n = nearestGlobal(lastGpsLat, lastGpsLon);
    markerIdx = n.idx;
    gpsDistance = n.d;
    resetSource = 'gps';
  } else {
    const slider = getPositionSliderEl();
    if(slider){
      const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
      const frac = clamp((Number(slider.value) || 0) / 1000, 0, 1);
      markerIdx = nearestIndexByDistanceMeters(frac * total);
    }
  }

  if(sim) sim.value = route.length > 1 ? Math.round(1000*markerIdx/(route.length-1)) : 0;
  trackingInitialized = resetSource === 'gps';
  manualLockUntil = resetSource === 'gps' ? 0 : Date.now() + MANUAL_LOCK_MS;
  manualLockCenterDist = resetSource === 'gps' ? null : route[markerIdx].dist;
  resetRoughTrack(route[markerIdx].dist);
  recordSpeedPosition(route[markerIdx].dist, 'reset');
  keepMarkerVisible();
  updateInfo(gpsDistance, lastGpsAccuracy);
  draw();

  const appSpeedEl = document.getElementById('appSpeed');
  if(appSpeedEl) appSpeedEl.textContent = '-';
  statusEl.textContent = resetSource === 'gps'
    ? 'Zresetowano czas i prędkość. Pozycję ustawiono według GPS.'
    : 'Zresetowano czas i prędkość. Brak GPS: pozycję ustawiono według suwaka GPX.';
}

function updateRoughTrackFromGps(lat, lon, acc){
  if(!route.length) return;
  if(roughTrack.signature !== currentRouteSignature()) loadRoughTrack();
  if(acc != null && Number.isFinite(acc) && acc > 120) return;

  const now = Date.now();
  const pt = {lat, lon, t:now, dist:roughTrack.dist || 0};
  const last = roughTrack.points.length ? roughTrack.points[roughTrack.points.length-1] : null;

  if(!last){
    roughTrack.points.push(pt);
    saveRoughTrack();
    return;
  }

  const dd = hav({lat:last.lat, lon:last.lon}, {lat, lon});
  const dt = Math.max(0, (now - (last.t || now))/1000);

  // Filtr szumu GPS na postoju i dużych skoków po długiej przerwie.
  // To jest tylko zgrubny kilometraż pomocniczy, nie licznik treningowy.
  if(dd < 25 && dt < 180) return;
  if(dd > 8000) return;

  roughTrack.dist = Math.min(totalDist, Math.max(0, (roughTrack.dist || 0) + dd));
  pt.dist = roughTrack.dist;
  roughTrack.points.push(pt);
  if(roughTrack.points.length > 200) roughTrack.points = roughTrack.points.slice(-200);
  saveRoughTrack();
}
function nearestIndexByDistanceMeters(targetDist){
  if(!route.length) return 0;
  targetDist = clamp(targetDist, 0, totalDist);
  let best=0, bestDelta=Infinity;
  for(let i=0;i<route.length;i++){
    const d = Math.abs(route[i].dist - targetDist);
    if(d < bestDelta){ bestDelta=d; best=i; }
  }
  return best;
}
function prepare(points){
  gpxNotePoints = [];
  route = points.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  let d=0;
  for(let i=0;i<route.length;i++){
    if(i>0) d += hav(route[i-1], route[i]);
    route[i].dist = d;
    if(!Number.isFinite(route[i].ele)) route[i].ele = i>0 ? route[i-1].ele : 0;
  }
  totalDist=d;
  markerIdx=0;
  lastGpsDistance=null;
  lastGpsAccuracy=null;
  lastGpsLat=null;
  lastGpsLon=null;

  trackingInitialized=false;
  manualLockUntil = 0;
  manualLockCenterDist = null;
  loadRoughTrack();
  loadSpeedHistory();
  clearGpxNotePoints();
  if(roughTrack.dist > 0){ markerIdx = nearestIndexByDistanceMeters(roughTrack.dist); }

  // Twardy reset widoku po starcie i po każdym wczytaniu GPX.
  // Zapobiega pozostaniu starego powiększenia X/Y po poprzedniej trasie.
  xZoom=1;
  yStretch=1;
  viewStart=0;
  viewEnd=totalDist;
  autoCenter=false;

  sim.value = route.length > 1 ? Math.round(1000*markerIdx/(route.length-1)) : 0;
  updateInfo();
  resize();
}
function childText(node, tag){
  const el = node.getElementsByTagName(tag)[0];
  return el && el.textContent ? el.textContent.trim() : '';
}
function bestPointLabel(node){
  const parts = [childText(node, 'name'), childText(node, 'cmt'), childText(node, 'desc')]
    .map(s => String(s || '').trim())
    .filter(Boolean);
  if(!parts.length) return '';
  // Pierwszeństwo ma name, ale jeśli name jest techniczny, uzupełniamy go uwagą.
  const label = parts[0];
  if(parts.length > 1 && /^pkt|^point|^wpt|^waypoint/i.test(label)){
    return parts[1];
  }
  return label;
}
function parseGpxData(text){
  autoYActive = false;
  autoYMin = null;
  autoYMax = null;
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  const trackNodes = [...xml.getElementsByTagName('trkpt'), ...xml.getElementsByTagName('rtept')];
  const routePoints = trackNodes.map(n=>({
    lat:parseFloat(n.getAttribute('lat')),
    lon:parseFloat(n.getAttribute('lon')),
    ele:parseFloat((n.getElementsByTagName('ele')[0]||{}).textContent)
  }));
  const waypointNodes = [...xml.getElementsByTagName('wpt')];
  const notePoints = waypointNodes.map(n=>({
    lat:parseFloat(n.getAttribute('lat')),
    lon:parseFloat(n.getAttribute('lon')),
    label:bestPointLabel(n)
  })).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon) && p.label);
  return {routePoints, notePoints};

  bindPositionSliderV54();

  updatePositionSliderV54();
}
function nearestGlobal(lat, lon){
  const p={lat, lon};
  let best=0, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};
}

function nearestGlobalWithRoughMileage(lat, lon){
  const p={lat, lon};
  let distances=[];
  let bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    distances.push(d);
    if(d<bestD) bestD=d;
  }

  const rough = roughTrack && Number.isFinite(roughTrack.dist) ? roughTrack.dist : 0;
  let best=0, bestScore=Infinity;
  for(let i=0;i<route.length;i++){
    const d = distances[i];
    // Kandydaci bliscy geograficznie. Przy odcinkach tam–powrót będzie ich więcej.
    if(d > bestD + 80 && d > 160) continue;
    const roughPenalty = rough > 0 ? Math.abs(route[i].dist - rough) / 8 : 0;
    const score = d + roughPenalty;
    if(score < bestScore){ bestScore=score; best=i; }
  }
  return {idx:best, d:distances[best]};
}


function nearestInDistWindow(lat, lon, centerDist, halfWindow){
  const p={lat, lon};
  const startDist = Math.max(0, centerDist - halfWindow);
  const endDist = Math.min(totalDist, centerDist + halfWindow);
  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};
}

function nearestTracked(lat, lon){
  const p={lat, lon};

  // Po ustawieniu pozycji ręcznie przez pewien czas nie pozwalamy
  // algorytmowi przeskoczyć na inny, podobny geograficznie fragment GPX.
  if(route.length && Date.now() < manualLockUntil && Number.isFinite(manualLockCenterDist)){
    const locked = nearestInDistWindow(lat, lon, manualLockCenterDist, MANUAL_LOCK_WINDOW_M);
    if(Number.isFinite(locked.d)){
      manualLockCenterDist = route[locked.idx].dist;
      return locked;
    }
  }

  if(!trackingInitialized || !route.length){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    trackingInitialized = true;
    return g;
  }

  const currentDist = route[markerIdx].dist;
  const backWindow = 700;     // pozwala na wolne cofanie i korekty GPS
  const forwardWindow = 2500; // pozwala na normalny postęp między kolejnymi odczytami
  const startDist = Math.max(0, currentDist - backWindow);
  const endDist = Math.min(totalDist, currentDist + forwardWindow);

  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }

  // Reaktywacja po dużym zejściu ze śladu lub po przerwie.
  // Próg jest wysoki, żeby nie przeskakiwać między odcinkami tam/powrót
  // biegnącymi tą samą drogą.
  if(bestD > 1000){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    if(g.d < bestD){ return g; }
  }

  return {idx:best, d:bestD};
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function centerViewOnMarker(){

function keepMarkerVisible(){

    viewStart = clamp(markerDist + margin - width, 0, maxStart);

function autoScrollAfterMarkerHalf(){

}

function elevationAtDist(targetDist){
  if(!route.length) return null;
  targetDist = clamp(targetDist, 0, totalDist);
  let lo = 0, hi = route.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < targetDist) lo = mid + 1; else hi = mid;
  }
  const i = lo;
  if(i <= 0) return route[0].ele;
  const a = route[i-1], b = route[i];
  const span = Math.max(0.001, b.dist - a.dist);
  const f = (targetDist - a.dist) / span;
  return a.ele + f * (b.ele - a.ele);
}

function nearestRouteIndexByDist(dist){
  if(!route || !route.length) return null;
  let lo = 0, hi = route.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < dist) lo = mid + 1; else hi = mid;
  }
  if(lo > 0 && Math.abs(route[lo-1].dist - dist) < Math.abs(route[lo].dist - dist)) return lo-1;
  return lo;
}

function slopePercentAtIndex(idx){
  if(!route.length) return null;

  const d1 = clamp(d - 20, 0, totalDist);
  const d2 = clamp(d + 20, 0, totalDist);
  const e1 = elevationAtDist(d1);
  const e2 = elevationAtDist(d2);
  const span = d2 - d1;
  if(e1 === null || e2 === null || span <= 0.1) return null;
  return 100 * (e2 - e1) / span;
}

function manualSpeedMps(){

}
function appSpeedKmh(){
  if(!speedHistory || !Array.isArray(speedHistory.points) || speedHistory.points.length < 2) return null;
  const now = Date.now();
  const tauMs = 45 * 60 * 1000;
  let sumW = 0;
  let sumWV = 0;
  for(let i=1; i<speedHistory.points.length; i++){
    const a = speedHistory.points[i-1];
    const b = speedHistory.points[i];
    if(!a || !b) continue;
    const dtH = (b.t - a.t) / 3600000;
    const ddKm = (b.dist - a.dist) / 1000;
    if(!Number.isFinite(dtH) || !Number.isFinite(ddKm) || dtH <= 1/120 || dtH > 1 || ddKm <= 0.02) continue;
    const vSeg = ddKm / dtH;
    if(!Number.isFinite(vSeg) || vSeg < 0 || vSeg > 120) continue;
    const ageMs = Math.max(0, now - b.t);
    const w = Math.exp(-ageMs / tauMs);
    sumW += w;
    sumWV += w * vSeg;
  }
  if(sumW <= 0) return null;
  const v = sumWV / sumW;
  if(!Number.isFinite(v) || v < 0 || v > 120) return null;
  return v;
}
function slopePercentBetweenDist(startDist, endDist){
  if(!route.length) return null;
  const span = endDist - startDist;
  if(!Number.isFinite(span) || Math.abs(span) < 1) return null;
  const e1 = elevationAtDist(startDist);
  const e2 = elevationAtDist(endDist);
  if(e1 === null || e2 === null || !Number.isFinite(e1) || !Number.isFinite(e2)) return null;
  return 100 * (e2 - e1) / span;
}
function speedSlopeModelKmh(){
  if(!speedHistory || !Array.isArray(speedHistory.points) || speedHistory.points.length < 4) return null;
  const now = Date.now();
  const tauMs = 45 * 60 * 1000;
  let sumW = 0, sumWS = 0, sumWV = 0;
  const rows = [];

  for(let i=1; i<speedHistory.points.length; i++){
    const a = speedHistory.points[i-1];
    const b = speedHistory.points[i];
    if(!a || !b) continue;
    const dtH = (b.t - a.t) / 3600000;
    const ddKm = (b.dist - a.dist) / 1000;
    if(!Number.isFinite(dtH) || !Number.isFinite(ddKm) || dtH <= 1/120 || dtH > 1 || ddKm <= 0.02) continue;
    const speed = ddKm / dtH;
    if(!Number.isFinite(speed) || speed < 0 || speed > 120) continue;
    const slope = slopePercentBetweenDist(a.dist, b.dist);
    if(slope === null || !Number.isFinite(slope)) continue;
    const w = Math.exp(-Math.max(0, now - b.t) / tauMs);
    rows.push({w, slope, speed});
    sumW += w;
    sumWS += w * slope;
    sumWV += w * speed;
  }

  if(rows.length < 3 || sumW <= 0) return null;
  const meanS = sumWS / sumW;
  const meanV = sumWV / sumW;
  let varS = 0, covSV = 0;
  for(const r of rows){
    const ds = r.slope - meanS;
    const dv = r.speed - meanV;
    varS += r.w * ds * ds;
    covSV += r.w * ds * dv;
  }
  if(varS < 0.01) return null;
  const a = covSV / varS;
  const b = meanV - a * meanS;
  if(!Number.isFinite(a) || !Number.isFinite(b)) return null;
  return {a, b, count:rows.length};
}
function modeledSpeedKmhForSlope(slope){
  if(slope === null || !Number.isFinite(slope)) return null;
  const model = speedSlopeModelKmh();

  const speed = model.a * slope + model.b;
  if(!Number.isFinite(speed)) return null;
  return clamp(speed, 1, 120);
}
function effectiveSpeedMps(slope=null){
  // Wpisana prędkość > 0 ma pierwszeństwo.
  // Wartość 0 lub puste pole oznacza tryb automatyczny na podstawie historii pozycji GPS/Ustaw km.
  const manual = manualSpeedMps();
  if(manual !== null) return manual;
  const modeled = modeledSpeedKmhForSlope(slope);
  if(modeled !== null) return modeled / 3.6;
  const appV = appSpeedKmh();
  if(appV === null) return null;
  return appV / 3.6;
}
function etaToEndSeconds(){
  if(!route.length) return null;
  const p = route[markerIdx];

  return left / speed;
}
function etaToForecastSeconds(){

  const fs = forecastStats();
  if(!fs) return null;
  const dist = Math.max(0, fs.endDist - fs.startDist);
  const slope = slopePercentBetweenDist(fs.startDist, fs.endDist);
  const speed = effectiveSpeedMps(slope);
  if(speed === null) return null;
  return dist / speed;
}

function draw(){
  if(!route.length) return;
  if(viewEnd<=viewStart){ viewStart=0; viewEnd=totalDist; }
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const padL=76*devicePixelRatio, padR=18*devicePixelRatio, padT=22*devicePixelRatio, padB=72*devicePixelRatio;
  const vis=visibleRoute();

  // Zakres Y ma stałą wysokość, ale środek osi jest ustawiany na wysokości
  // aktualnego punktu GPX. Dzięki temu znacznik pozostaje pionowo w połowie
  // wykresu podczas przewijania profilu.
  const allEles=route.map(p=>p.ele).filter(Number.isFinite);
  let minRaw=Math.min(...allEles), maxRaw=Math.max(...allEles);
  if(!Number.isFinite(minRaw) || !Number.isFinite(maxRaw) || maxRaw<=minRaw){ minRaw=0; maxRaw=1; }
  const rawRange=Math.max(20, maxRaw-minRaw+20);
  const shownRange=rawRange / yStretch;
  const markerEle = route[markerIdx] && Number.isFinite(route[markerIdx].ele) ? route[markerIdx].ele : (minRaw+maxRaw)/2;
  const minE=markerEle-shownRange/2, maxE=markerEle+shownRange/2;
  function x(p){return padL + ((p.dist-viewStart)/(viewEnd-viewStart))*(w-padL-padR);}
  function y(p){return padT + (1-(p.ele-minE)/(maxE-minE))*(h-padT-padB);}
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.4*devicePixelRatio; ctx.font=(22*devicePixelRatio)+'px system-ui'; ctx.fillStyle='#94a3b8';
  for(let k=0;k<=4;k++){
    const yy=padT+k*(h-padT-padB)/4; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke();
    const val=Math.round(maxE-k*(maxE-minE)/4); ctx.fillText(val+' m', 6*devicePixelRatio, yy+7*devicePixelRatio);
  }
  ctx.beginPath();
  let started=false;
  for(let i=0;i<route.length;i++){
    const p=route[i];
    if(p.dist<viewStart || p.dist>viewEnd) continue;
    const xx=x(p), yy=y(p);
    if(!started){ ctx.moveTo(xx,yy); started=true; } else ctx.lineTo(xx,yy);
  }
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2.2*devicePixelRatio; ctx.stroke();
  drawUserPoints(x, y, padT, padB, w, h);
  const m=route[markerIdx];
  if(m.dist>=viewStart && m.dist<=viewEnd){
    const mx=x(m), my=y(m);
    const mc = markerColor();
    ctx.strokeStyle=mc; ctx.lineWidth=2.2*devicePixelRatio; ctx.beginPath(); ctx.moveTo(mx,padT); ctx.lineTo(mx,h-padB); ctx.stroke();
    ctx.fillStyle=mc;
    ctx.beginPath();
    ctx.arc(mx,my,8*devicePixelRatio,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#020617'; ctx.lineWidth=2*devicePixelRatio; ctx.stroke();
    drawSlopeLabelAtMarker(mx, my, padT, h-padB);

  }
  drawForecast(x, padL, padT, padB, w, h);
  drawDistanceScale(padL, padR, padT, padB, w, h);

  // // drawSlopeLabelOverlay();

  // drawForwardSlopeFieldInDraw
  updateForwardSlope50Field();

  updateSliderFromMarkerV54();

  updatePositionSliderV54();
}


function routeSampleAtDist(targetDist){
  if(!route.length) return null;
  targetDist = clamp(targetDist, 0, totalDist);
  if(targetDist <= 0) return {...route[0]};
  if(targetDist >= totalDist) return {...route[route.length-1]};
  for(let i=1;i<route.length;i++){
    const a=route[i-1], b=route[i];
    if(b.dist >= targetDist){
      const span = Math.max(1e-9, b.dist-a.dist);
      const f = (targetDist-a.dist)/span;
      return {
        lat:a.lat+(b.lat-a.lat)*f,
        lon:a.lon+(b.lon-a.lon)*f,
        ele:a.ele+(b.ele-a.ele)*f,
        dist:targetDist
      };
    }
  }
  return {...route[route.length-1]};
}

function forecastStats(){
  if(!route.length) return null;
  const startDist = route[markerIdx] ? route[markerIdx].dist : 0;
  const width = Math.max(1, viewEnd-viewStart);
  const endDist = clamp(startDist + width*forecastOffsetRatio, 0, totalDist);
  return elevationStatsBetweenDist(startDist, endDist);
}

function elevationStatsBetweenDist(startDist, endDist){
  if(!route.length) return null;
  startDist = clamp(startDist, 0, totalDist);
  endDist = clamp(endDist, 0, totalDist);
  if(endDist <= startDist + 1) return {startDist, endDist, up:0, down:0};

  const samples = [routeSampleAtDist(startDist)];
  for(const p of route){
    if(p.dist > startDist && p.dist < endDist) samples.push(p);
  }
  samples.push(routeSampleAtDist(endDist));

  let up=0, down=0;
  for(let i=1;i<samples.length;i++){
    const d = samples[i].ele - samples[i-1].ele;
    if(d>0) up += d;
    else down += -d;
  }
  return {startDist, endDist, up, down};
}


function clampForecastRatio(v){
  if(!Number.isFinite(v)) return 0.25;
  return clamp(v, 0, 1.00);
}
function setForecastFromClientX(clientX){
  if(!route.length || viewEnd<=viewStart) return;
  const rect=canvas.getBoundingClientRect();
  const xCss=clientX-rect.left;
  const wCss=rect.width;
  const padL=76, padR=18;
  const frac=clamp((xCss-padL)/(wCss-padL-padR),0,1);
  const targetDist=viewStart+frac*(viewEnd-viewStart);
  const startDist=route[markerIdx] ? route[markerIdx].dist : 0;
  forecastOffsetRatio=clampForecastRatio((targetDist-startDist)/(viewEnd-viewStart));
  localStorage.setItem('profilGpsForecastOffsetRatio', String(forecastOffsetRatio));

function isForecastHandle(clientX, clientY){
  if(!forecastLabelHit) return false;
  const rect=canvas.getBoundingClientRect();
  const x=(clientX-rect.left)*devicePixelRatio;
  const y=(clientY-rect.top)*devicePixelRatio;
  const h=forecastLabelHit;
  const labelHit=x>=h.lx && x<=h.lx+h.labelW && y>=h.ly && y<=h.ly+h.labelH;
  const lineHit=Math.abs(x-h.fx)<=34*devicePixelRatio && y>=h.padT && y<=h.bottom;
  // v54 bottom forecast handle zone
  const bottomZone = Math.abs(x-h.fx) <= 46*devicePixelRatio && y >= (h.bottom - 90*devicePixelRatio) && y <= h.bottom;
  return labelHit || lineHit || bottomZone;
}


function drawSlopeLabelAtMarker(x, y, padT, bottom){
  const slope = slopePercentAtIndex(markerIdx);
  if(slope === null || !Number.isFinite(slope)) return;

  const dpr = devicePixelRatio || 1;
  const text = (slope >= 0 ? "+" : "") + slope.toFixed(1) + " %";

  ctx.save();
  ctx.font = `bold ${28*dpr}px system-ui, -apple-system, Segoe UI, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const metrics = ctx.measureText(text);
  const boxW = metrics.width + 30*dpr;
  const boxH = 46*dpr;
  let bx = x - boxW/2;
  let by = y + 16*dpr;

  const leftLimit = 82*dpr;
  const rightLimit = canvas.width - 20*dpr;
  if(bx < leftLimit) bx = leftLimit;
  if(bx + boxW > rightLimit) bx = rightLimit - boxW;
  if(by + boxH > bottom - 6*dpr) by = y - boxH - 16*dpr;
  if(by < padT + 6*dpr) by = padT + 6*dpr;

  const r = 10*dpr;
  ctx.beginPath();
  ctx.moveTo(bx+r, by);
  ctx.lineTo(bx+boxW-r, by);
  ctx.quadraticCurveTo(bx+boxW, by, bx+boxW, by+r);
  ctx.lineTo(bx+boxW, by+boxH-r);
  ctx.quadraticCurveTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH);
  ctx.lineTo(bx+r, by+boxH);
  ctx.quadraticCurveTo(bx, by+boxH, bx, by+boxH-r);
  ctx.lineTo(bx, by+r);
  ctx.quadraticCurveTo(bx, by, bx+r, by);
  ctx.closePath();

  ctx.fillStyle = "rgba(3, 7, 18, 0.90)";
  ctx.fill();
  ctx.lineWidth = 2*dpr;
  ctx.strokeStyle = "#f59e0b";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.fillText(text, bx + boxW/2, by + boxH/2 + 1*dpr);
  ctx.restore();
}


function routeIndexNearDistance(dist){
  if(!route || !route.length) return null;
  let best = 0;
  let bestD = Math.abs(route[0].dist - dist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - dist);
    if(d < bestD){ bestD = d; best = i; }
  }
  return best;
}

function computeSlopeAtMarkerPercent(){
  if(!route || !route.length || markerIdx == null || !route[markerIdx]) return null;
  const d0 = route[markerIdx].dist;
  const i1 = routeIndexNearDistance(Math.max(0, d0 - 20));
  const i2 = routeIndexNearDistance(Math.min(totalDist, d0 + 20));
  if(i1 == null || i2 == null || i1 === i2) return null;
  const dd = route[i2].dist - route[i1].dist;
  if(!Number.isFinite(dd) || Math.abs(dd) < 1) return null;
  const dh = route[i2].ele - route[i1].ele;
  if(!Number.isFinite(dh)) return null;
  return 100 * dh / dd;
}

function drawSlopeLabelOverlay(){
  if(!route || !route.length || markerIdx == null || !route[markerIdx]) return;
  if(typeof xForDist !== "function" || typeof yForEle !== "function") return;

  const slope = computeSlopeAtMarkerPercent();
  if(slope === null || !Number.isFinite(slope)) return;

  const x = xForDist(route[markerIdx].dist);
  const y = yForEle(route[markerIdx].ele);
  const dpr = devicePixelRatio || 1;
  const txt = (slope >= 0 ? "+" : "") + slope.toFixed(1) + " %";

  ctx.save();
  ctx.font = `bold ${30*dpr}px system-ui, -apple-system, Segoe UI, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const metrics = ctx.measureText(txt);
  const boxW = metrics.width + 32*dpr;
  const boxH = 50*dpr;

  let bx = x - boxW / 2;
  let by = y + 18*dpr;

  const leftLimit = 76*dpr;
  const rightLimit = canvas.width - 18*dpr;
  const topLimit = padT + 6*dpr;
  const bottomLimit = bottom - 6*dpr;

  if(bx < leftLimit) bx = leftLimit;
  if(bx + boxW > rightLimit) bx = rightLimit - boxW;
  if(by + boxH > bottomLimit) by = y - boxH - 18*dpr;
  if(by < topLimit) by = topLimit;

  const r = 12*dpr;
  ctx.beginPath();
  ctx.moveTo(bx+r, by);
  ctx.lineTo(bx+boxW-r, by);
  ctx.quadraticCurveTo(bx+boxW, by, bx+boxW, by+r);
  ctx.lineTo(bx+boxW, by+boxH-r);
  ctx.quadraticCurveTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH);
  ctx.lineTo(bx+r, by+boxH);
  ctx.quadraticCurveTo(bx, by+boxH, bx, by+boxH-r);
  ctx.lineTo(bx, by+r);
  ctx.quadraticCurveTo(bx, by, bx+r, by);
  ctx.closePath();

  ctx.fillStyle = "rgba(3, 7, 18, 0.92)";
  ctx.fill();
  ctx.lineWidth = 2.5*dpr;
  ctx.strokeStyle = "#f59e0b";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.fillText(txt, bx + boxW/2, by + boxH/2 + 1*dpr);
  ctx.restore();
}


function drawForecast(x, padL, padT, padB, w, h){
  const fs = forecastStats();
  if(!fs || fs.endDist < viewStart - 1 || fs.endDist > viewEnd + 1){ forecastLabelHit=null; return; }
  const fx = x({dist:fs.endDist, ele:0});

  ctx.save();
  ctx.setLineDash([6*devicePixelRatio, 5*devicePixelRatio]);
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 1.5*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(fx, padT);
  ctx.lineTo(fx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  const text1 = 'Prognoza';
  const text2 = '↑ '+Math.round(fs.up)+' m   ↓ '+Math.round(fs.down)+' m';
  const text3 = ((fs.endDist - fs.startDist) / 1000).toFixed(2) + ' km';
  const font1 = 28*devicePixelRatio;
  const font2 = 18*devicePixelRatio;

  const labelW = Math.max(ctx.measureText(text1).width, ctx.measureText(text2).width, ctx.measureText(text3).width) + 22*devicePixelRatio;
  const labelH = 96*devicePixelRatio;

  let lx = fx - labelW/2;
  lx = clamp(lx, padL, w - 16*devicePixelRatio - labelW);

  ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';

  ctx.lineWidth = 1.1*devicePixelRatio;

  ctx.fill();
  ctx.stroke();

  const cx = lx + labelW/2;
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 1.1*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(cx, ly + labelH);
  ctx.lineTo(fx, ly + labelH + 10*devicePixelRatio);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 '+font1+'px system-ui';
  ctx.fillStyle = '#ddd6fe';
  ctx.fillText(text1, lx + labelW/2, ly + 25*devicePixelRatio);

  ctx.fillStyle = '#e5e7eb';
  ctx.fillText(text2, lx + labelW/2, ly + 56*devicePixelRatio);
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText(text3, lx + labelW/2, ly + 78*devicePixelRatio);
  forecastLabelHit = {lx, ly, labelW, labelH, fx, padT, bottom};
  ctx.restore();
}

function drawUserPoints(x, y, padT, padB, w, h){
  const points = allVisiblePoints();
  if(!points.length) return;
  const visiblePoints = points.filter(pt => pt.dist >= viewStart && pt.dist <= viewEnd);
  if(!visiblePoints.length) return;

  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold '+(18*devicePixelRatio)+'px system-ui';
  const placedLabels = [];
  const labelTop = padT + 8*devicePixelRatio;
  const labelGap = 6*devicePixelRatio;
  const labelRows = 3;
  for(const pt of visiblePoints){
    const ele = elevationAtDist(pt.dist);
    const xx = x({dist:pt.dist, ele:ele});
    const yy = y({dist:pt.dist, ele:ele});
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1.5*devicePixelRatio;
    ctx.beginPath();
    ctx.moveTo(xx, padT);
    ctx.lineTo(xx, h-padB);
    ctx.stroke();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.arc(xx, yy, 5*devicePixelRatio, 0, Math.PI*2);
    ctx.fill();
    const text = String(pt.label || 'punkt');
    const labelW = Math.min(ctx.measureText(text).width + 24*devicePixelRatio, 260*devicePixelRatio);
    const labelH = 32*devicePixelRatio;
    let lx = clamp(xx - labelW/2, padLForFloatingLabels(), w - 18*devicePixelRatio - labelW);
    let row = 0;
    while(row < labelRows && placedLabels.some(r => r.row === row && lx < r.right + labelGap && lx + labelW > r.left - labelGap)){
      row++;
    }
    if(row >= labelRows){
      row = labelRows - 1;
      lx = clamp(lx, padLForFloatingLabels(), w - 18*devicePixelRatio - labelW);
    }
    const ly = labelTop + row * (labelH + labelGap);
    placedLabels.push({row, left:lx, right:lx+labelW});
    ctx.fillStyle='rgba(2, 6, 23, 0.90)';
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1*devicePixelRatio;
    ctx.beginPath();
    ctx.roundRect(lx, ly, labelW, labelH, 9*devicePixelRatio);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#fde68a';
    ctx.save();
    ctx.beginPath();
    ctx.rect(lx+6*devicePixelRatio, ly, labelW-12*devicePixelRatio, labelH);
    ctx.clip();
    ctx.fillText(text, lx+labelW/2, ly+labelH/2);
    ctx.restore();
  }
  ctx.restore();
}

function drawDistanceScale(padL, padR, padT, padB, w, h){

function routeIndexAtOrNearDistForward50(dist){
  if(!route || !route.length) return null;
  let best = 0;
  let bestD = Math.abs(route[0].dist - dist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - dist);
    if(d < bestD){
      bestD = d;
      best = i;
    }
  }
  return best;
}

function computeForwardSlope50m(){
  if(!route || !route.length || markerIdx == null || !route[markerIdx]) return null;
  const start = route[markerIdx].dist;
  const end = Math.min(totalDist || start, start + 50);
  if(end <= start + 1) return null;

  const i1 = markerIdx;
  const i2 = routeIndexAtOrNearDistForward50(end);
  if(i2 == null || i2 === i1 || !route[i2]) return null;

  const dd = route[i2].dist - route[i1].dist;
  if(!Number.isFinite(dd) || dd <= 1) return null;

  const dh = route[i2].ele - route[i1].ele;
  if(!Number.isFinite(dh)) return null;

  return 100 * dh / dd;
}

function updateForwardSlope50Field(){
  const el = document.getElementById("slopeForward50Value");
  if(!el) return;
  const slope = computeForwardSlope50m();
  if(slope === null || !Number.isFinite(slope)){
    el.textContent = "-";
  } else {
    el.textContent = (slope >= 0 ? "+" : "") + slope.toFixed(1) + " %";
  }
}

    const afterStats = fsForAscent ? elevationStatsBetweenDist(fsForAscent.endDist, totalDist) : null;

  const appV = modeledSpeedKmhForSlope(forecastSlope) ?? appSpeedKmh();
  if(appSpeedEl) appSpeedEl.textContent = appV === null ? '-' : appV.toFixed(1) + ' km/h';
  document.getElementById('ele').textContent=Math.round(p.ele)+' m';
  document.getElementById('left').textContent=((totalDist-p.dist)/1000).toFixed(2)+' km';
  document.getElementById('eta').textContent=formatArrivalTime(forecastSeconds);
  const offEl = document.getElementById('off');
  if(offEl) offEl.textContent=lastGpsDistance==null?'-':Math.round(lastGpsDistance)+' m';
  const accEl = document.getElementById('acc');
  if(accEl) accEl.textContent=lastGpsAccuracy==null?'-':Math.round(lastGpsAccuracy)+' m';
  if(lastGpsDistance!=null){

    else if(lastGpsDistance<=500) statusEl.innerHTML='<span class="accent">GPS aktywny: jesteś 100–500 m od śladu.</span>';
    else statusEl.innerHTML='<span class="bad">GPS aktywny: jesteś ponad 500 m od śladu.</span>';
  }
  updateForwardSlope50Field();

  updateSliderFromMarkerV54();

  updatePositionSliderV54();
}

function startPinchIfPossible(){
  if(activePointers.size < 2 || !route.length) return;
  const pts = Array.from(activePointers.values()).slice(0,2);
  const dx = Math.abs(pts[0].x - pts[1].x);
  const centerX = (pts[0].x + pts[1].x) / 2;
  pinchState = {startDx: Math.max(10, dx), startZoom: xZoom, keepDist: distFromCanvasX(centerX)};
  dragState = null;
}
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size === 1 && isForecastHandle(e.clientX, e.clientY)){
    forecastDragState={id:e.pointerId};
    setForecastFromClientX(e.clientX);
    dragState=null;
    e.preventDefault();
    return;
  }
  if(activePointers.size === 1){
    dragState={id:e.pointerId, x:e.clientX, start:viewStart, end:viewEnd};
  } else if(activePointers.size === 2){
    forecastDragState=null;
    startPinchIfPossible();
  }
});
canvas.addEventListener('pointermove', e=>{
  if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(forecastDragState && forecastDragState.id===e.pointerId){
    setForecastFromClientX(e.clientX);
    e.preventDefault();
    return;
  }

  if(pinchState && activePointers.size >= 2){
    const pts = Array.from(activePointers.values()).slice(0,2);
    const dx = Math.abs(pts[0].x - pts[1].x);
    const ratio = clamp(dx / pinchState.startDx, 0.25, 4);
    applyXZoom(pinchState.startZoom * ratio, pinchState.keepDist);
    return;
  }

  if(!dragState || dragState.id!==e.pointerId || xZoom<=1) return;
  const rect=canvas.getBoundingClientRect();
  const dx=e.clientX-dragState.x;
  const dd=-(dx/rect.width)*(dragState.end-dragState.start);
  const width=dragState.end-dragState.start;
  viewStart=clamp(dragState.start+dd,0,Math.max(0,totalDist-width));
  viewEnd=viewStart+width;
  autoCenter=false;
  draw();
});
function endPointer(e){
  activePointers.delete(e.pointerId);
  if(forecastDragState && forecastDragState.id===e.pointerId){
    forecastDragState=null;
    updateInfo();
    draw();
    return;
  }
  if(pinchState){
    pinchState = null;
    if(activePointers.size === 1){
      const remaining = Array.from(activePointers.entries())[0];
      if(remaining){
        dragState = {id: remaining[0], x: remaining[1].x, start:viewStart, end:viewEnd};
      }
    }
    return;
  }
  if(dragState && dragState.id===e.pointerId) dragState=null;
}

// ===== v54: naprawa suwaka pozycji =====
function getPositionSliderEl(){
  return document.getElementById("positionSlider") || document.querySelector('input[type="range"]');
}

function setMarkerByKmV54(km){
  if(!route || !route.length) return;
  let targetDist = Number(km) * 1000;
  if(!Number.isFinite(targetDist)) return;
  targetDist = Math.max(0, Math.min(totalDist || targetDist, targetDist));

  let best = 0;
  let bestD = Math.abs(route[0].dist - targetDist);
  for(let i=1; i<route.length; i++){
    const d = Math.abs(route[i].dist - targetDist);
    if(d < bestD){ bestD = d; best = i; }
  }

  markerIdx = best;

  // Synchronizacja zgrubnego kilometrażu z suwakiem.
  if(typeof roughKm !== "undefined") roughKm = route[best].dist / 1000;
  if(typeof currentGpxKm !== "undefined") currentGpxKm = route[best].dist / 1000;
  if(typeof lastProjectedKm !== "undefined") lastProjectedKm = route[best].dist / 1000;

  if(typeof keepMarkerVisible === "function") keepMarkerVisible();
  if(typeof draw === "function") draw();
  if(typeof updateInfo === "function") updateInfo();
}

function updateSliderFromMarkerV54(){
  const s = getPositionSliderEl();
  if(!s || !route || !route.length || markerIdx == null || !route[markerIdx]) return;
  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const value = total > 0 ? Math.round((route[markerIdx].dist / total) * 1000) : 0;
  s.value = String(Math.max(0, Math.min(1000, value)));
}

// ===== v54: suwak pozycji 0-1000 =====
let suppressSliderUpdateV54 = false;

function nearestRouteIndexByDistanceV54(distMeters){
  if(!route || !route.length) return 0;
  let lo = 0;
  let hi = route.length - 1;

  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < distMeters) lo = mid + 1;
    else hi = mid;
  }

  if(lo > 0 && Math.abs(route[lo-1].dist - distMeters) < Math.abs(route[lo].dist - distMeters)){
    return lo - 1;
  }
  return lo;
}

function setMarkerByDistanceV54(distMeters, source){
  if(!route || !route.length) return;

  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const d = Math.max(0, Math.min(total, Number(distMeters) || 0));
  const idx = nearestRouteIndexByDistanceV54(d);

  markerIdx = idx;

  // Synchronizacja zmiennych używanych przez różne wersje aplikacji.
  try { currentGpxKm = route[idx].dist / 1000; } catch(e) {}
  try { lastProjectedKm = route[idx].dist / 1000; } catch(e) {}
  try { roughKm = route[idx].dist / 1000; } catch(e) {}

  // Widok X: nie skaczemy agresywnie, tylko pilnujemy, żeby marker był widoczny.
  if(typeof ensureMarkerVisible === "function") ensureMarkerVisible();
  else if(typeof keepMarkerVisible === "function") keepMarkerVisible();
  else {
    const width = viewEnd - viewStart;
    if(route[idx].dist < viewStart) {
      viewStart = Math.max(0, route[idx].dist - width * 0.15);
      viewEnd = viewStart + width;
    } else if(route[idx].dist > viewEnd) {
      viewEnd = Math.min(total, route[idx].dist + width * 0.15);
      viewStart = viewEnd - width;
    }
  }

  updatePositionSliderV54();
  if(typeof updateInfo === "function") updateInfo();
  if(typeof draw === "function") draw();
}

function updatePositionSliderV54(){
  const s = document.getElementById("positionSlider");
  if(!s || !route || !route.length || markerIdx == null || !route[markerIdx]) return;
  const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
  const value = total > 0 ? Math.round((route[markerIdx].dist / total) * 1000) : 0;
  suppressSliderUpdateV54 = true;
  s.value = String(Math.max(0, Math.min(1000, value)));
  suppressSliderUpdateV54 = false;
}

function bindPositionSliderV54(){
  const s = document.getElementById("positionSlider");
  if(!s || s.dataset.boundV54 === "1") return;
  s.dataset.boundV54 = "1";
  s.min = "0";
  s.max = "1000";
  s.step = "1";

  const handler = function(){
    if(suppressSliderUpdateV54) return;
    if(!route || !route.length) return;
    const total = Number.isFinite(totalDist) && totalDist > 0 ? totalDist : route[route.length-1].dist;
    const frac = (Number(s.value) || 0) / 1000;
    setMarkerByDistanceV54(frac * total, "slider");
  };

  s.addEventListener("input", handler);
  s.addEventListener("change", handler);
  s.addEventListener("pointerdown", e => e.stopPropagation());
  s.addEventListener("touchstart", e => e.stopPropagation(), {passive:true});
}

document.addEventListener("DOMContentLoaded", bindPositionSliderV54);
setTimeout(bindPositionSliderV54, 0);
setTimeout(bindPositionSliderV54, 400);
setInterval(bindPositionSliderV54, 1500);


// ===== v54: stabilne uruchamianie GPS =====
let gpsWatchIdV54 = null;

function setGpsStatusV54(text){
  const el = document.getElementById("status");
  if(el) el.textContent = text;
}

function applyGpsPositionV54(pos){
  if(!pos || !pos.coords) return;
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;

  setGpsStatusV54("GPS: włączony");

  // Użyj istniejącej logiki projektu, jeżeli działa.
  if(typeof handleGpsPosition === "function"){
    handleGpsPosition(pos);
    return;
  }
  if(typeof handlePosition === "function"){
    handlePosition(pos);
    return;
  }
  if(typeof updateFromGps === "function"){
    updateFromGps(lat, lon, pos.coords.accuracy);
    return;
  }

  // Fallback: znajdź najbliższy punkt GPX po współrzędnych.
  if(route && route.length){
    let best = 0;
    let bestD = Infinity;
    for(let i=0; i<route.length; i++){
      const p = route[i];
      if(!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
      const dy = (p.lat - lat) * 111320;
      const dx = (p.lon - lon) * 111320 * Math.cos(lat * Math.PI / 180);
      const d2 = dx*dx + dy*dy;
      if(d2 < bestD){ bestD = d2; best = i; }
    }
    markerIdx = best;
    setMarkerByDistanceV54(route[best].dist, "gps");
  }
}

function startGpsV54(){
  if(!navigator.geolocation){
    setGpsStatusV52("GPS: brak obsługi w przeglądarce");
    return;
  }

  setGpsStatusV52("GPS: uruchamianie");

  try{
    if(gpsWatchIdV54 !== null){
      navigator.geolocation.clearWatch(gpsWatchIdV54);
      gpsWatchIdV54 = null;
    }

    gpsWatchIdV54 = navigator.geolocation.watchPosition(
      applyGpsPositionV54,
      err => {
        setGpsStatusV52("GPS: błąd " + (err && err.message ? err.message : ""));
      },
      {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
    );

    navigator.geolocation.getCurrentPosition(
      applyGpsPositionV54,
      err => {
        setGpsStatusV52("GPS: błąd " + (err && err.message ? err.message : ""));
      },
      {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
    );
  } catch(e){
    setGpsStatusV52("GPS: błąd " + e.message);
  }
}

function bindGpsButtonV54(){
  const b = document.getElementById("gpsBtn");
  if(b && b.dataset.boundGpsV54 !== "1"){
    b.dataset.boundGpsV54 = "1";
    b.addEventListener("click", startGpsV54);
  }
}
document.addEventListener("DOMContentLoaded", bindGpsButtonV54);
setTimeout(bindGpsButtonV54, 0);
setTimeout(bindGpsButtonV54, 500);


// ===== v54: stabilne wczytywanie GPX i waypointów =====
function haversineMetersV54(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function cumulativeRouteV54(points){
  let dist = 0;
  for(let i=0; i<points.length; i++){
    if(i > 0){
      dist += haversineMetersV54(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
    }
    points[i].dist = dist;
  }
  return dist;
}

function nearestRouteIndexToLatLonV54(lat, lon){
  if(!route || !route.length) return 0;
  let best = 0;
  let bestD = Infinity;
  for(let i=0; i<route.length; i++){
    const p = route[i];
    if(!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
    const d = haversineMetersV54(lat, lon, p.lat, p.lon);
    if(d < bestD){
      bestD = d;
      best = i;
    }
  }
  return best;
}

function nearestRouteIndexByDistV54(distMeters){
  if(!route || !route.length) return 0;
  let lo = 0;
  let hi = route.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < distMeters) lo = mid + 1;
    else hi = mid;
  }
  if(lo > 0 && Math.abs(route[lo-1].dist - distMeters) < Math.abs(route[lo].dist - distMeters)) return lo-1;
  return lo;
}

function parseGpxTextV54(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  const parserError = doc.querySelector("parsererror");
  if(parserError) throw new Error("Nieprawidłowy format XML/GPX.");

  const readPt = el => {
    const lat = Number(el.getAttribute("lat"));
    const lon = Number(el.getAttribute("lon"));
    const eleEl = el.querySelector("ele");
    const ele = eleEl ? Number(eleEl.textContent) : 0;
    return {lat, lon, ele: Number.isFinite(ele) ? ele : 0, dist: 0};
  };

  let pts = Array.from(doc.querySelectorAll("trkpt")).map(readPt)
    .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));

  if(pts.length < 2){
    pts = Array.from(doc.querySelectorAll("rtept")).map(readPt)
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }

  if(pts.length < 2){
    throw new Error("W pliku GPX nie znaleziono śladu trasy trkpt ani rtept.");
  }

  const wpts = Array.from(doc.querySelectorAll("wpt")).map(w => {
    const lat = Number(w.getAttribute("lat"));
    const lon = Number(w.getAttribute("lon"));
    const name = (w.querySelector("name")?.textContent || w.querySelector("cmt")?.textContent || w.querySelector("desc")?.textContent || "").trim();
    return {lat, lon, name};
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon) && p.name);

  return {pts, wpts};
}

function applyRouteV54(points, waypoints, sourceName){
  route = points;
  totalDist = cumulativeRouteV54(route);

  markerIdx = 0;
  viewStart = 0;
  viewEnd = totalDist;

  if(typeof xZoom !== "undefined") xZoom = 1;
  if(typeof yStretch !== "undefined") yStretch = 1;

  const elevations = route.map(p => p.ele).filter(Number.isFinite);
  if(elevations.length){
    const minEle = Math.min(...elevations);
    const maxEle = Math.max(...elevations);
    const pad = Math.max(20, (maxEle - minEle) * 0.12);
    baseYMin = minEle - pad;
    baseYMax = maxEle + pad;
  }

  // Waypointy z GPX jako punkty opisowe na profilu.
  const mapped = [];
  for(const w of (waypoints || [])){
    const idx = nearestRouteIndexToLatLonV54(w.lat, w.lon);
    mapped.push({
      name: w.name,
      label: w.name,
      dist: route[idx].dist,
      ele: route[idx].ele,
      lat: w.lat,
      lon: w.lon
    });
  }

  // Obsłuż różne nazwy zmiennych z poprzednich wersji.
  try { gpxNotePoints = mapped; } catch(e) {}
  try { userPoints = mapped; } catch(e) {}
  try { routePoints = mapped; } catch(e) {}
  window.gpxNotePoints = mapped;

  const slider = document.getElementById("positionSlider") || document.querySelector('input[type="range"]');
  if(slider){
    slider.min = "0";
    slider.max = "1000";
    slider.step = "1";
    slider.value = "0";
  }

  if(typeof bindPositionSliderV54 === "function") bindPositionSliderV54();
  if(typeof bindPositionSliderV54 === "function") bindPositionSliderV54();
  if(typeof updateInfo === "function") updateInfo();
  if(typeof draw === "function") draw();

  const status = document.getElementById("status");
  if(status) status.textContent = "GPX wczytany: " + (sourceName || "plik") + " (" + (totalDist/1000).toFixed(2) + " km)";
}

async function handleGpxFileV54(file){
  if(!file) return;
  const text = await file.text();
  const parsed = parseGpxTextV54(text);
  applyRouteV54(parsed.pts, parsed.wpts, file.name);
}

function bindGpxInputV54(){
  const inputs = Array.from(document.querySelectorAll('input[type="file"]'));
  const gpxInput = inputs.find(i => (i.accept || "").toLowerCase().includes("gpx")) || inputs[0];

  if(!gpxInput || gpxInput.dataset.boundGpxV54 === "1") return;
  gpxInput.dataset.boundGpxV54 = "1";

  gpxInput.addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    try{
      await handleGpxFileV54(file);
    } catch(err){
      const status = document.getElementById("status");
      if(status) status.textContent = "Błąd wczytywania GPX: " + err.message;
      alert("Błąd wczytywania GPX: " + err.message);
    }
  });
}

document.addEventListener("DOMContentLoaded", bindGpxInputV54);
setTimeout(bindGpxInputV54, 0);
setTimeout(bindGpxInputV54, 500);
setInterval(bindGpxInputV54, 2000);

if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }

  } else {
    resize();
    statusEl.textContent='Wczytaj plik GPX.';
  }
}
initializeApp();
