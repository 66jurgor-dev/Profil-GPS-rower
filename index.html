<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil trasy GPS offline</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --line:#38bdf8; --accent:#f59e0b; --bad:#ef4444; --ok:#22c55e; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
header { padding:12px 14px; background:#020617; border-bottom:1px solid #1f2937; }
h1 { font-size:18px; margin:0 0 4px 0; }
.small { color:var(--muted); font-size:12px; }
main { padding:10px; display:grid; gap:10px; }
.panel { background:var(--panel); border:1px solid #1f2937; border-radius:14px; padding:10px; }
.info-panel { display:flex; flex-direction:column; gap:10px; }
.info-panel .controls { margin-top:auto; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button, label.file { color:var(--text); border:1px solid #374151; padding:9px 11px; border-radius:10px; font-size:14px; }
button.blue, label.file.blue { background:#2563eb; border-color:#1d4ed8; }
button.green { background:#16a34a; border-color:#15803d; }
button.orange { background:#f59e0b; border-color:#d97706; color:#111827; font-weight:700; }
button.red { background:#dc2626; border-color:#b91c1c; }
button:active, label.file:active { transform:translateY(1px); }
input[type=file] { display:none; }
input.speed-input { width:100%; margin-top:6px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:8px; font-size:18px; font-weight:700; }
input.point-input { min-width:160px; flex:1 1 180px; background:#111827; color:var(--text); border:1px solid #374151; border-radius:10px; padding:9px 11px; font-size:14px; }
canvas { width:100%; height:46vh; min-height:280px; display:block; background:#020617; border-radius:12px; touch-action:none; }
.grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
.tile { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:9px; }
.tile b { display:block; font-size:18px; margin-top:3px; }
.tile b.coord { font-size:16px; letter-spacing:0.2px; }
.status { font-size:14px; color:var(--muted); }
.ok { color:var(--ok); } .bad { color:var(--bad); } .accent { color:var(--accent); }
.range { width:100%; }
@media (orientation:landscape) { main { grid-template-columns: 1.6fr 1fr; } canvas { height:72vh; } }
</style>
</head>
<body>
<header>
  <h1>Profil trasy GPS offline</h1>
</header>
<main>
<section class="panel">
  <canvas id="profile"></canvas>
  <input id="sim" class="range" type="range" min="0" max="1000" value="0">
</section>
<section class="panel info-panel">
  <p id="status" class="status">Wczytaj plik GPX albo użyj trasy wbudowanej do testu interfejsu.</p>
  <div class="grid">
    <div class="tile">Prędkość [km/h]<input id="manualSpeed" class="speed-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="np. 14.5"></div>
    <div class="tile">Pozycja na GPX<b id="km">-</b></div>
    <div class="tile">Pozycja GPS<b id="gpxCoord">-</b></div>
    <div class="tile">Km aplikacji<b id="roughKm">-</b></div>
    <div class="tile">Do końca GPX<b id="left">-</b></div>
    <div class="tile">Wysokość z GPX<b id="ele">-</b></div>
    <div class="tile">Odległość od śladu<b id="off">-</b></div>
    <div class="tile">Aktualny czas<b id="clock">-</b></div>
    <div class="tile">Cel<b id="eta">-</b></div>
  </div>
  <div class="controls">
    <label class="file blue">Wczytaj GPX<input id="file" type="file" accept=".gpx,application/gpx+xml,text/xml"></label>
    <button id="gpsBtn" class="blue">Start GPS</button>
    <button id="fitBtn" class="green">Pokaż całość</button>
    <button id="zoomInXBtn" class="green">Powiększ X</button>
    <button id="zoomOutXBtn" class="green">Pomniejsz X</button>
    <button id="zoomInYBtn" class="green">Powiększ Y</button>
    <button id="zoomOutYBtn" class="green">Pomniejsz Y</button>
    <button id="centerBtn" class="orange">Do pozycji</button>
    <button id="manualPosBtn" class="red">Ustaw km</button>
    <input id="pointName" class="point-input" type="text" placeholder="Miejscowość / punkt">
    <button id="addPointBtn" class="blue">Wstaw punkt</button>
  </div>
</section>
</main>
<script src="trasa.js"></script>
<script>
let route = [];
let totalDist = 0;
let markerIdx = 0;
let lastGpsDistance = null;
let lastGpsAccuracy = null;
let lastGpsLat = null;
let lastGpsLon = null;
let roughTrack = {signature:null, dist:0, points:[]};
const ROUGH_KEY = 'profilGpsRoughTrackV12';
let manualLockUntil = 0;
let manualLockCenterDist = null;
let userPoints = [];
const POINTS_KEY = 'profilGpsUserPointsV14';
const MANUAL_LOCK_MS = 30 * 60 * 1000;
const MANUAL_LOCK_WINDOW_M = 2500;

function formatCoordValue(value, digitsBefore){
  if(!Number.isFinite(value)) return '-';
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value);
  let s = abs.toFixed(6);
  const parts = s.split('.');
  parts[0] = parts[0].padStart(digitsBefore, '0');
  return sign + parts[0] + '.' + parts[1];
}
function formatGpxCoord(p){
  if(!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lon)) return '-';
  return formatCoordValue(p.lat, 2) + ' ' + formatCoordValue(p.lon, 3);
}

let watchId = null;
let wakeLock = null;
let trackingInitialized = false;
let viewStart = 0;
let viewEnd = 0;
let xZoom = 1;
let yStretch = 1;
let autoCenter = false;
let dragState = null;
let pinchState = null;
const canvas = document.getElementById('profile');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const sim = document.getElementById('sim');
function rad(x){ return x*Math.PI/180; }
function hav(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const lat1=rad(a.lat), lat2=rad(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function currentRouteSignature(){
  if(!route.length) return null;
  const first = route[0], last = route[route.length-1];
  return [
    route.length,
    Math.round(totalDist),
    first.lat.toFixed(5), first.lon.toFixed(5),
    last.lat.toFixed(5), last.lon.toFixed(5)
  ].join('|');
}
function loadRoughTrack(){
  const sig = currentRouteSignature();
  try{
    const raw = localStorage.getItem(ROUGH_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if(obj && obj.signature === sig && Number.isFinite(obj.dist)){
      roughTrack = {signature:sig, dist:obj.dist, points:Array.isArray(obj.points)?obj.points:[]};
    } else {
      roughTrack = {signature:sig, dist:0, points:[]};
    }
  }catch(e){
    roughTrack = {signature:sig, dist:0, points:[]};
  }
}
function saveRoughTrack(){
  try{ localStorage.setItem(ROUGH_KEY, JSON.stringify(roughTrack)); }catch(e){}
}

function routeSpecificKey(baseKey){
  const sig = currentRouteSignature() || 'none';
  return baseKey + '|' + sig;
}
function loadUserPoints(){
  try{
    const raw = localStorage.getItem(routeSpecificKey(POINTS_KEY));
    const arr = raw ? JSON.parse(raw) : [];
    userPoints = Array.isArray(arr) ? arr.filter(p => Number.isFinite(p.dist) && p.label) : [];
  }catch(e){ userPoints = []; }
}
function saveUserPoints(){
  try{ localStorage.setItem(routeSpecificKey(POINTS_KEY), JSON.stringify(userPoints)); }catch(e){}
}
function addUserPoint(){
  if(!route.length) return;
  const input = document.getElementById('pointName');
  const label = input ? input.value.trim() : '';
  if(!label){
    statusEl.innerHTML='<span class="accent">Wpisz nazwę punktu lub miejscowości.</span>';
    return;
  }
  const dist = route[markerIdx].dist;
  userPoints.push({dist, label});
  userPoints.sort((a,b)=>a.dist-b.dist);
  saveUserPoints();
  if(input) input.value='';
  draw();
  statusEl.innerHTML='<span class="ok">Wstawiono punkt: '+escapeHtml(label)+' na km '+(dist/1000).toFixed(2)+'.</span>';
}
function escapeHtml(text){
  return String(text).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
function resetRoughTrack(dist=0){
  roughTrack = {signature:currentRouteSignature(), dist:Math.max(0, dist||0), points:[]};
  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    roughTrack.points.push({lat:lastGpsLat, lon:lastGpsLon, t:Date.now(), dist:roughTrack.dist});
  }
  saveRoughTrack();
  updateInfo();
}
function updateRoughTrackFromGps(lat, lon, acc){
  if(!route.length) return;
  if(roughTrack.signature !== currentRouteSignature()) loadRoughTrack();
  if(acc != null && Number.isFinite(acc) && acc > 120) return;

  const now = Date.now();
  const pt = {lat, lon, t:now, dist:roughTrack.dist || 0};
  const last = roughTrack.points.length ? roughTrack.points[roughTrack.points.length-1] : null;

  if(!last){
    roughTrack.points.push(pt);
    saveRoughTrack();
    return;
  }

  const dd = hav({lat:last.lat, lon:last.lon}, {lat, lon});
  const dt = Math.max(0, (now - (last.t || now))/1000);

  // Filtr szumu GPS na postoju i dużych skoków po długiej przerwie.
  // To jest tylko zgrubny kilometraż pomocniczy, nie licznik treningowy.
  if(dd < 25 && dt < 180) return;
  if(dd > 8000) return;

  roughTrack.dist = Math.min(totalDist, Math.max(0, (roughTrack.dist || 0) + dd));
  pt.dist = roughTrack.dist;
  roughTrack.points.push(pt);
  if(roughTrack.points.length > 200) roughTrack.points = roughTrack.points.slice(-200);
  saveRoughTrack();
}
function nearestIndexByDistanceMeters(targetDist){
  if(!route.length) return 0;
  targetDist = clamp(targetDist, 0, totalDist);
  let best=0, bestDelta=Infinity;
  for(let i=0;i<route.length;i++){
    const d = Math.abs(route[i].dist - targetDist);
    if(d < bestDelta){ bestDelta=d; best=i; }
  }
  return best;
}
function prepare(points){
  route = points.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  let d=0;
  for(let i=0;i<route.length;i++){
    if(i>0) d += hav(route[i-1], route[i]);
    route[i].dist = d;
    if(!Number.isFinite(route[i].ele)) route[i].ele = i>0 ? route[i-1].ele : 0;
  }
  totalDist=d;
  markerIdx=0;
  lastGpsDistance=null;
  lastGpsAccuracy=null;
  lastGpsLat=null;
  lastGpsLon=null;

  trackingInitialized=false;
  loadRoughTrack();
  loadUserPoints();
  if(roughTrack.dist > 0){ markerIdx = nearestIndexByDistanceMeters(roughTrack.dist); }
  sim.value=Math.round(1000*markerIdx/(route.length-1));
  viewStart=0;
  viewEnd=totalDist;
  xZoom=1;
  yStretch=1;
  autoCenter=false;
  updateInfo(); draw();
}
function parseGpx(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  const nodes = [...xml.getElementsByTagName('trkpt'), ...xml.getElementsByTagName('rtept')];
  return nodes.map(n=>({lat:parseFloat(n.getAttribute('lat')), lon:parseFloat(n.getAttribute('lon')), ele:parseFloat((n.getElementsByTagName('ele')[0]||{}).textContent)}));
}
function nearestGlobal(lat, lon){
  const p={lat, lon};
  let best=0, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};
}

function nearestGlobalWithRoughMileage(lat, lon){
  const p={lat, lon};
  let distances=[];
  let bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const d=hav(p,route[i]);
    distances.push(d);
    if(d<bestD) bestD=d;
  }

  const rough = roughTrack && Number.isFinite(roughTrack.dist) ? roughTrack.dist : 0;
  let best=0, bestScore=Infinity;
  for(let i=0;i<route.length;i++){
    const d = distances[i];
    // Kandydaci bliscy geograficznie. Przy odcinkach tam–powrót będzie ich więcej.
    if(d > bestD + 80 && d > 160) continue;
    const roughPenalty = rough > 0 ? Math.abs(route[i].dist - rough) / 8 : 0;
    const score = d + roughPenalty;
    if(score < bestScore){ bestScore=score; best=i; }
  }
  return {idx:best, d:distances[best]};
}


function nearestInDistWindow(lat, lon, centerDist, halfWindow){
  const p={lat, lon};
  const startDist = Math.max(0, centerDist - halfWindow);
  const endDist = Math.min(totalDist, centerDist + halfWindow);
  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return {idx:best, d:bestD};
}

function nearestTracked(lat, lon){
  const p={lat, lon};

  // Po ustawieniu pozycji ręcznie przez pewien czas nie pozwalamy
  // algorytmowi przeskoczyć na inny, podobny geograficznie fragment GPX.
  if(route.length && Date.now() < manualLockUntil && Number.isFinite(manualLockCenterDist)){
    const locked = nearestInDistWindow(lat, lon, manualLockCenterDist, MANUAL_LOCK_WINDOW_M);
    if(Number.isFinite(locked.d)){
      manualLockCenterDist = route[locked.idx].dist;
      return locked;
    }
  }

  if(!trackingInitialized || !route.length){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    trackingInitialized = true;
    return g;
  }

  const currentDist = route[markerIdx].dist;
  const backWindow = 700;     // pozwala na wolne cofanie i korekty GPS
  const forwardWindow = 2500; // pozwala na normalny postęp między kolejnymi odczytami
  const startDist = Math.max(0, currentDist - backWindow);
  const endDist = Math.min(totalDist, currentDist + forwardWindow);

  let best=markerIdx, bestD=Infinity;
  for(let i=0;i<route.length;i++){
    const rd = route[i].dist;
    if(rd < startDist || rd > endDist) continue;
    const d=hav(p,route[i]);
    if(d<bestD){ bestD=d; best=i; }
  }

  // Reaktywacja po dużym zejściu ze śladu lub po przerwie.
  // Próg jest wysoki, żeby nie przeskakiwać między odcinkami tam/powrót
  // biegnącymi tą samą drogą.
  if(bestD > 1000){
    const g = nearestGlobalWithRoughMileage(lat, lon);
    if(g.d < bestD){ return g; }
  }

  return {idx:best, d:bestD};
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function centerViewOnMarker(){
  if(!route.length || xZoom<=1){ viewStart=0; viewEnd=totalDist; return; }
  const width = totalDist / xZoom;
  const c = route[markerIdx].dist;
  viewStart = clamp(c - width/2, 0, Math.max(0, totalDist-width));
  viewEnd = viewStart + width;
}

function keepMarkerVisible(){
  if(!route.length || xZoom<=1) return;

  const width = viewEnd - viewStart;
  if(width <= 0 || width >= totalDist) return;

  const maxStart = Math.max(0, totalDist - width);
  const markerDist = route[markerIdx].dist;
  const margin = width * 0.08;

  if(markerDist < viewStart + margin){
    viewStart = clamp(markerDist - margin, 0, maxStart);
    viewEnd = viewStart + width;
  } else if(markerDist > viewEnd - margin){
    viewStart = clamp(markerDist + margin - width, 0, maxStart);
    viewEnd = viewStart + width;
  }
}

function autoScrollAfterMarkerHalf(){
  if(!route.length || xZoom<=1) return;

  const width = viewEnd - viewStart;
  if(width <= 0 || width >= totalDist) return;

  const maxStart = Math.max(0, totalDist - width);
  const markerDist = route[markerIdx].dist;
  const middle = viewStart + width/2;

  // Przewijanie działa w obie strony: po minięciu połowy widoku
  // znacznik jest utrzymywany w połowie, z wyjątkiem początku i końca trasy.
  if(markerDist > middle || markerDist < middle){
    viewStart = clamp(markerDist - width/2, 0, maxStart);
    viewEnd = viewStart + width;
  }
}

function applyXZoom(newZoom, keepDist=null){
  if(!route.length) return;
  xZoom = clamp(newZoom, 1, 24);
  if(xZoom<=1){ viewStart=0; viewEnd=totalDist; draw(); return; }

  const width = totalDist / xZoom;
  const maxStart = Math.max(0, totalDist - width);
  const markerDist = route[markerIdx].dist;

  // Przy powiększaniu/pomniejszaniu priorytet ma widoczność znacznika.
  // Jeżeli nie podano punktu zakotwiczenia, widok jest ustawiany wokół znacznika.
  const center = keepDist==null ? markerDist : keepDist;
  viewStart = clamp(center - width/2, 0, maxStart);
  viewEnd = viewStart + width;
  keepMarkerVisible();
  draw();
}
function distFromCanvasX(clientX){
  const rect=canvas.getBoundingClientRect();
  const xCss=clientX-rect.left;
  const wCss=rect.width;
  const padL=52, padR=16;
  const frac=clamp((xCss-padL)/(wCss-padL-padR),0,1);
  return viewStart + frac*(viewEnd-viewStart);
}
function visibleRoute(){
  if(!route.length) return [];
  return route.filter(p => p.dist>=viewStart && p.dist<=viewEnd);
}
function markerColor(){
  if(lastGpsDistance==null) return '#f59e0b';
  if(lastGpsDistance<=100) return '#22c55e';
  if(lastGpsDistance<=500) return '#f59e0b';
  return '#ef4444';
}
function markerStatusClass(){
  if(lastGpsDistance==null) return 'accent';
  if(lastGpsDistance<=100) return 'ok';
  if(lastGpsDistance<=500) return 'accent';
  return 'bad';
}

function elevationAtDist(targetDist){
  if(!route.length) return null;
  targetDist = clamp(targetDist, 0, totalDist);
  let lo = 0, hi = route.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(route[mid].dist < targetDist) lo = mid + 1; else hi = mid;
  }
  const i = lo;
  if(i <= 0) return route[0].ele;
  const a = route[i-1], b = route[i];
  const span = Math.max(0.001, b.dist - a.dist);
  const f = (targetDist - a.dist) / span;
  return a.ele + f * (b.ele - a.ele);
}
function slopePercentAtIndex(idx){
  if(!route.length) return null;
  const d = route[idx].dist;
  const d1 = clamp(d - 20, 0, totalDist);
  const d2 = clamp(d + 20, 0, totalDist);
  const e1 = elevationAtDist(d1);
  const e2 = elevationAtDist(d2);
  const span = d2 - d1;
  if(e1 === null || e2 === null || span <= 0.1) return null;
  return 100 * (e2 - e1) / span;
}
function formatSlope(value){
  if(value === null || !Number.isFinite(value)) return '-';
  const sign = value > 0 ? '+' : '';
  return sign + value.toFixed(1) + ' %';
}

function formatClock(date=new Date()){
  return date.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
}
function formatArrivalTime(seconds){
  if(seconds === null || !Number.isFinite(seconds) || seconds < 0) return '-';
  const target = new Date(Date.now() + seconds * 1000);
  return formatClock(target);
}
function manualSpeedMps(){
  const el = document.getElementById('manualSpeed');
  if(!el) return null;
  const raw = String(el.value || '').replace(',', '.');
  const kmh = parseFloat(raw);
  if(!Number.isFinite(kmh) || kmh <= 0) return null;
  return kmh / 3.6;
}
function etaToEndSeconds(){
  if(!route.length) return null;
  const p = route[markerIdx];
  const left = Math.max(0, totalDist - p.dist);
  const speed = manualSpeedMps();
  if(speed === null) return null;
  return left / speed;
}


function setManualPositionFromSlider(){
  if(!route.length) return;

  // Suwak oznacza przybliżony już przejechany kilometr GPX.
  // Po kliknięciu program nie przyjmuje suwaka jako finalnej pozycji,
  // tylko szuka najbliższego punktu GPX względem aktualnego GPS
  // w oknie wokół wskazanego kilometra. Dzięki temu odcinki tam–powrót
  // są rozróżniane przez postęp po śladzie, a nie przez samą lokalizację.
  const approxIdx = Math.round((route.length-1)*(sim.value/1000));
  const approxDist = route[approxIdx].dist;

  let n = null;
  if(Number.isFinite(lastGpsLat) && Number.isFinite(lastGpsLon)){
    n = nearestInDistWindow(lastGpsLat, lastGpsLon, approxDist, 2000);
  } else {
    n = {idx: approxIdx, d: null};
  }

  markerIdx = n.idx;
  sim.value = Math.round(1000*markerIdx/(route.length-1));
  trackingInitialized = true;
  manualLockCenterDist = route[markerIdx].dist;
  manualLockUntil = Date.now() + MANUAL_LOCK_MS;
  resetRoughTrack(route[markerIdx].dist);

  if(n.d !== null) updateInfo(n.d, lastGpsAccuracy);
  else updateInfo();

  keepMarkerVisible();
  draw();

  const km = (route[markerIdx].dist/1000).toFixed(2);
  if(n.d !== null){
    statusEl.innerHTML='<span class="accent">Ustaw km: pozycja ustawiona: najbliższy punkt GPX w pobliżu wskazanego kilometra, km '+km+', odległość od GPS '+Math.round(n.d)+' m.</span>';
  } else {
    statusEl.innerHTML='<span class="accent">Ustaw km: pozycja ustawiona z suwaka: km '+km+'. Brak aktualnego odczytu GPS do dopasowania punktu.</span>';
  }
}

function resize(){
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * devicePixelRatio);
  canvas.height = Math.round(r.height * devicePixelRatio);
  draw();
}
function draw(){
  if(!route.length) return;
  if(viewEnd<=viewStart){ viewStart=0; viewEnd=totalDist; }
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const padL=52*devicePixelRatio, padR=16*devicePixelRatio, padT=18*devicePixelRatio, padB=54*devicePixelRatio;
  const vis=visibleRoute();

  // Zakres Y ma stałą wysokość, ale środek osi jest ustawiany na wysokości
  // aktualnego punktu GPX. Dzięki temu znacznik pozostaje pionowo w połowie
  // wykresu podczas przewijania profilu.
  const allEles=route.map(p=>p.ele).filter(Number.isFinite);
  let minRaw=Math.min(...allEles), maxRaw=Math.max(...allEles);
  if(!Number.isFinite(minRaw) || !Number.isFinite(maxRaw) || maxRaw<=minRaw){ minRaw=0; maxRaw=1; }
  const rawRange=Math.max(20, maxRaw-minRaw+20);
  const shownRange=rawRange / yStretch;
  const markerEle = route[markerIdx] && Number.isFinite(route[markerIdx].ele) ? route[markerIdx].ele : (minRaw+maxRaw)/2;
  const minE=markerEle-shownRange/2, maxE=markerEle+shownRange/2;
  function x(p){return padL + ((p.dist-viewStart)/(viewEnd-viewStart))*(w-padL-padR);}
  function y(p){return padT + (1-(p.ele-minE)/(maxE-minE))*(h-padT-padB);}
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.4*devicePixelRatio; ctx.font=(11*devicePixelRatio)+'px system-ui'; ctx.fillStyle='#94a3b8';
  for(let k=0;k<=4;k++){
    const yy=padT+k*(h-padT-padB)/4; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke();
    const val=Math.round(maxE-k*(maxE-minE)/4); ctx.fillText(val+' m', 6*devicePixelRatio, yy+4*devicePixelRatio);
  }
  ctx.beginPath();
  let started=false;
  for(let i=0;i<route.length;i++){
    const p=route[i];
    if(p.dist<viewStart || p.dist>viewEnd) continue;
    const xx=x(p), yy=y(p);
    if(!started){ ctx.moveTo(xx,yy); started=true; } else ctx.lineTo(xx,yy);
  }
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2.2*devicePixelRatio; ctx.stroke();
  drawUserPoints(x, y, padT, padB, w, h);
  const m=route[markerIdx];
  if(m.dist>=viewStart && m.dist<=viewEnd){
    const mx=x(m), my=y(m);
    const mc = markerColor();
    ctx.strokeStyle=mc; ctx.lineWidth=2.2*devicePixelRatio; ctx.beginPath(); ctx.moveTo(mx,padT); ctx.lineTo(mx,h-padB); ctx.stroke();
    ctx.fillStyle=mc; ctx.beginPath(); ctx.arc(mx,my,8*devicePixelRatio,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#020617'; ctx.lineWidth=2*devicePixelRatio; ctx.stroke();

    const slopeText = formatSlope(slopePercentAtIndex(markerIdx));
    ctx.font='bold '+(18*devicePixelRatio)+'px system-ui';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const labelW = ctx.measureText(slopeText).width + 24*devicePixelRatio;
    const labelH = 32*devicePixelRatio;
    let lx = clamp(mx - labelW/2, padL, w - padR - labelW);
    let ly = my - 46*devicePixelRatio;
    if(ly < padT + 4*devicePixelRatio) ly = my + 28*devicePixelRatio;
    ctx.fillStyle='rgba(2, 6, 23, 0.88)';
    ctx.strokeStyle=mc;
    ctx.lineWidth=1.4*devicePixelRatio;
    ctx.beginPath();
    ctx.roundRect(lx, ly, labelW, labelH, 9*devicePixelRatio);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#e5e7eb';
    ctx.fillText(slopeText, lx + labelW/2, ly + labelH/2);
    ctx.textAlign='start';
    ctx.textBaseline='alphabetic';
  }
  drawDistanceScale(padL, padR, padT, padB, w, h);
}

function drawUserPoints(x, y, padT, padB, w, h){
  if(!userPoints.length) return;
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold '+(18*devicePixelRatio)+'px system-ui';
  for(const pt of userPoints){
    if(pt.dist < viewStart || pt.dist > viewEnd) continue;
    const ele = elevationAtDist(pt.dist);
    const xx = x({dist:pt.dist, ele:ele});
    const yy = y({dist:pt.dist, ele:ele});
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1.5*devicePixelRatio;
    ctx.beginPath();
    ctx.moveTo(xx, padT);
    ctx.lineTo(xx, h-padB);
    ctx.stroke();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.arc(xx, yy, 5*devicePixelRatio, 0, Math.PI*2);
    ctx.fill();
    const text = String(pt.label || 'punkt');
    const labelW = Math.min(ctx.measureText(text).width + 24*devicePixelRatio, 260*devicePixelRatio);
    const labelH = 32*devicePixelRatio;
    let lx = clamp(xx - labelW/2, 54*devicePixelRatio, w - 18*devicePixelRatio - labelW);
    let ly = yy - 46*devicePixelRatio;
    if(ly < padT + 4*devicePixelRatio) ly = yy + 28*devicePixelRatio;
    ctx.fillStyle='rgba(2, 6, 23, 0.90)';
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=1*devicePixelRatio;
    ctx.beginPath();
    ctx.roundRect(lx, ly, labelW, labelH, 9*devicePixelRatio);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#fde68a';
    ctx.save();
    ctx.beginPath();
    ctx.rect(lx+6*devicePixelRatio, ly, labelW-12*devicePixelRatio, labelH);
    ctx.clip();
    ctx.fillText(text, lx+labelW/2, ly+labelH/2);
    ctx.restore();
  }
  ctx.restore();
}

function drawDistanceScale(padL, padR, padT, padB, w, h){
  const axisY = h - 30*devicePixelRatio;
  const tickTop = axisY - 6*devicePixelRatio;
  const tickBottom = axisY + 6*devicePixelRatio;
  const labelY = h - 10*devicePixelRatio;
  const plotW = w - padL - padR;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.1*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(padL, axisY);
  ctx.lineTo(w-padR, axisY);
  ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = (11*devicePixelRatio)+'px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let k=0;k<=4;k++){
    const frac = k/4;
    const xx = padL + frac*plotW;
    const distKm = (viewStart + frac*(viewEnd-viewStart))/1000;
    ctx.beginPath();
    ctx.moveTo(xx, tickTop);
    ctx.lineTo(xx, tickBottom);
    ctx.stroke();
    ctx.fillText(distKm.toFixed(1)+' km', xx, labelY);
  }
  ctx.textAlign = 'left';
  ctx.fillText('X×'+xZoom.toFixed(1)+'  Y×'+yStretch.toFixed(1), padL, padT-8*devicePixelRatio);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}
function updateInfo(gpsD=null, acc=null){
  if(!route.length) return;
  if(gpsD!==null) lastGpsDistance=gpsD;
  if(acc!==null) lastGpsAccuracy=acc;
  const p=route[markerIdx];
  document.getElementById('km').textContent=(p.dist/1000).toFixed(2)+' km';
  const coordEl = document.getElementById('gpxCoord');
  if(coordEl){ coordEl.textContent = formatGpxCoord(p); coordEl.classList.add('coord'); }
  const rk = document.getElementById('roughKm');
  if(rk) rk.textContent = roughTrack && Number.isFinite(roughTrack.dist) ? (roughTrack.dist/1000).toFixed(2)+' km' : '-';
  document.getElementById('ele').textContent=Math.round(p.ele)+' m';
  document.getElementById('left').textContent=((totalDist-p.dist)/1000).toFixed(2)+' km';
  document.getElementById('clock').textContent=formatClock();
  document.getElementById('eta').textContent=formatArrivalTime(etaToEndSeconds());
  document.getElementById('off').textContent=lastGpsDistance==null?'-':Math.round(lastGpsDistance)+' m';
  const accEl = document.getElementById('acc');
  if(accEl) accEl.textContent=lastGpsAccuracy==null?'-':Math.round(lastGpsAccuracy)+' m';
  if(lastGpsDistance!=null){
    if(lastGpsDistance<=100) statusEl.innerHTML='<span class="ok">GPS aktywny: pozycja przy trasie.</span>';
    else if(lastGpsDistance<=500) statusEl.innerHTML='<span class="accent">GPS aktywny: jesteś 100–500 m od śladu.</span>';
    else statusEl.innerHTML='<span class="bad">GPS aktywny: jesteś ponad 500 m od śladu.</span>';
  }
}
setInterval(()=>{
  if(route.length) updateInfo();
}, 10000);

const manualSpeedEl = document.getElementById('manualSpeed');
if(manualSpeedEl){
  const savedSpeed = localStorage.getItem('profilGpsManualSpeedKmh');
  if(savedSpeed) manualSpeedEl.value = savedSpeed;
  manualSpeedEl.addEventListener('input', ()=>{
    localStorage.setItem('profilGpsManualSpeedKmh', manualSpeedEl.value);
    updateInfo();
  });
}

sim.addEventListener('input', ()=>{ markerIdx=Math.round((route.length-1)*(sim.value/1000)); updateInfo(); autoScrollAfterMarkerHalf(); draw(); });
document.getElementById('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const pts=parseGpx(await f.text());
  prepare(pts); statusEl.textContent='Wczytano GPX: '+f.name;
});
document.getElementById('gpsBtn').addEventListener('click', ()=>{
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; statusEl.textContent='GPS zatrzymany.'; return; }
  trackingInitialized=false;
  updateInfo();
  if(!navigator.geolocation){ statusEl.innerHTML='<span class="bad">Brak obsługi GPS w tej przeglądarce.</span>'; return; }
  watchId = navigator.geolocation.watchPosition(pos=>{
    lastGpsLat = pos.coords.latitude;
    lastGpsLon = pos.coords.longitude;
    updateRoughTrackFromGps(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    const n=nearestTracked(pos.coords.latitude, pos.coords.longitude);
    markerIdx=n.idx; sim.value=Math.round(1000*markerIdx/(route.length-1));
    updateInfo(n.d, pos.coords.accuracy);
    autoScrollAfterMarkerHalf();
    draw();
  }, err=>{ statusEl.innerHTML='<span class="bad">Błąd GPS: '+err.message+'</span>'; },
  {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
});
document.getElementById('zoomInXBtn').addEventListener('click', ()=>{ applyXZoom(xZoom*1.6, null); });
document.getElementById('zoomOutXBtn').addEventListener('click', ()=>{ applyXZoom(xZoom/1.6, null); });
document.getElementById('zoomInYBtn').addEventListener('click', ()=>{ yStretch=clamp(yStretch*1.35,0.0005,12); draw(); });
document.getElementById('zoomOutYBtn').addEventListener('click', ()=>{ yStretch=clamp(yStretch/1.35,0.0005,12); draw(); });
document.getElementById('centerBtn').addEventListener('click', ()=>{ centerViewOnMarker(); draw(); });
document.getElementById('manualPosBtn').addEventListener('click', setManualPositionFromSlider);
document.getElementById('addPointBtn').addEventListener('click', addUserPoint);
document.getElementById('fitBtn').addEventListener('click', ()=>{ xZoom=1; yStretch=1; viewStart=0; viewEnd=totalDist; draw(); });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const d=distFromCanvasX(e.clientX);
  autoCenter=false;
  applyXZoom(xZoom*(e.deltaY<0?1.2:1/1.2), d);
}, {passive:false});
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  dragState={id:e.pointerId, x:e.clientX, start:viewStart, end:viewEnd};
});
canvas.addEventListener('pointermove', e=>{
  if(!dragState || dragState.id!==e.pointerId || xZoom<=1) return;
  const rect=canvas.getBoundingClientRect();
  const dx=e.clientX-dragState.x;
  const dd=-(dx/rect.width)*(dragState.end-dragState.start);
  const width=dragState.end-dragState.start;
  viewStart=clamp(dragState.start+dd,0,Math.max(0,totalDist-width));
  viewEnd=viewStart+width;
  autoCenter=false;
  draw();
});
canvas.addEventListener('pointerup', e=>{ if(dragState && dragState.id===e.pointerId) dragState=null; });
canvas.addEventListener('pointercancel', ()=>{ dragState=null; });
window.addEventListener('resize', resize);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
prepare(BUILTIN_ROUTE);
resize();
</script>
